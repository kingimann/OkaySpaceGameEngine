<!DOCTYPE html>
<html><head><title>Sign in</title>
<style>
body { margin: 0; min-height: 600px; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); }
.box { width: 320px; margin: 60px auto; background: #fff; border-radius: 10px; padding: 24px 28px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
.sub { text-align: center; color: #777; margin: 0 0 18px; font-size: 14px; }
label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
input[type=email], input[type=password] { display: block; width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ccd; border-radius: 6px; font-size: 14px; }
.row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 13px; }
.row a { color: #667eea; }
button.primary { width: 100%; padding: 10px; border: 0; border-radius: 6px; color: #fff; font-size: 15px; background: linear-gradient(90deg, #667eea, #764ba2); }
.or { text-align: center; color: #aaa; font-size: 12px; margin: 14px 0; }
fieldset { border: 1px solid #eee; border-radius: 6px; }
legend { font-size: 12px; color: #888; }
</style></head>
<body>
<div class="box">
<h1>Welcome back</h1>
<p class="sub">Sign in to continue</p>
<form action="/login" method="post">
<label for="e">Email</label><input id="e" type="email" name="email" placeholder="you@example.com">
<label for="p">Password</label><input id="p" type="password" name="password" value="secret">
<div class="row"><span><input type="checkbox" name="r" checked> Remember me</span><a href="/forgot">Forgot password?</a></div>
<button class="primary" type="submit">Sign in</button>
</form>
<p class="or">or</p>
<fieldset><legend>Other ways</legend><button>Use a passkey</button> <button>Email me a link</button></fieldset>
</div>
</body></html>
