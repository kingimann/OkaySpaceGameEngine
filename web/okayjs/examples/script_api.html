<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>okay.js script API</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2330; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #state { position: fixed; left: 16px; top: 12px; color: #e8ecf4; font: 15px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="state"></div>
<script type="module">
// scripts/key_mover.js is the same text as a game script in the engine's JavaScript tests (tests/test_js_script.cpp,
// case 3): hold D and the ball moves right; `moved` counts the frames. Nothing in it knows it runs in a browser.
import { Game, Mesh, LitMaterial, MeshRenderer, Camera, Light, Vector3, Color } from '../okay.js';

const canvas = document.getElementById('view');
const params = new URLSearchParams(location.search);
const game = new Game({ canvas, renderer: { webgl: params.get('webgl') ? Number(params.get('webgl')) : 'auto',
                                            preserveDrawingBuffer: params.has('test') } });
const scene = game.scene;
const cam = scene.CreateGameObject('Main Camera');
cam.AddComponent(Camera, { fieldOfView: 45, nearClip: 0.1 });
cam.transform.position = new Vector3(0, 2, 8);
cam.transform.localEulerAngles = new Vector3(-12, 0, 0);   // looks down its -Z, tipped a little toward the floor
const sun = scene.CreateGameObject('Sun');
sun.AddComponent(Light);
sun.transform.eulerAngles = new Vector3(50, 200, 0);
const floor = scene.CreateGameObject('Floor');
floor.AddComponent(MeshRenderer, Mesh.Plane(12, 6), new LitMaterial({ color: Color.Parse('#3d465a') }));
floor.transform.position = new Vector3(0, -0.5, 0);
const player = scene.CreateGameObject('Player');
player.AddComponent(MeshRenderer, Mesh.Sphere(0.5, 32, 16), new LitMaterial({ color: Color.Parse('#5aa9e6'), shininess: 64 }));
player.transform.position = new Vector3(-3, 0, 0);

const text = await (await fetch('scripts/key_mover.js')).text();
const script = game.AddScript(player, text, { name: 'key_mover.js' });
const state = document.getElementById('state');
game.AddScript(scene.CreateGameObject('Status'), class Status {
    LateUpdate() { state.textContent = 'Hold D: moved ' + script.Get('moved') + ' frames, x = ' + player.transform.position.x.toFixed(2); }
});
game.start();
canvas.focus();
window.okayExample = { game, player, script, ready: true };
</script>
</body>
</html>
