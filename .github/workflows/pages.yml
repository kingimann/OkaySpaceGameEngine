name: Publish auth pages

# Publishes supabase/auth-pages (the password-reset landing page) to GitHub Pages
# at https://<owner>.github.io/<repo>/reset-password/ . Nothing else from the
# repository is published. One-time owner step: Settings > Pages > Source =
# "GitHub Actions" (see docs/password-reset.md).
on:
  push:
    branches: [main]
    paths: ['supabase/auth-pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: supabase/auth-pages
      - id: deployment
        uses: actions/deploy-pages@v4
