# Branch lint: cheap checks on every push to a Claude lane branch (claude/**, claude2/**, claude3/**; the lanes are in
# docs/lanes.json) and on every pull request from any other branch or fork (john/*, Grok's branches, outside forks), so
# those get the same checks. Not the full CI; about 1 to 5 minutes.
# Plain rules: docs/process/collaboration.md. Scripts: scripts/branch_lint.py, bug_patterns.py, collision_check.py.
#   fatal:      forbidden thread includes in Windows code (rule 21a), secrets, a push into another lane's open claim
#   warnings:   no docs changed, feature map not regenerated, MinGW syntax check, bug-class patterns
# Each warning shows as an annotation on the commit and in the job summary; nothing is commented on any issue or PR.
# A lane branch of this repo is checked on push only (its pull request would run the same checks twice).
# When a lane is added to docs/lanes.json, add its prefix to the two lists below (scripts/tests/test_collab.py checks it).
name: Branch lint
on:
  push:
    branches: ['claude/**', 'claude2/**', 'claude3/**']
  pull_request:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: branch-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !(startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'claude2/') || startsWith(github.head_ref, 'claude3/'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # what the branch is compared with: main for a push, the pull request's target for a pull request
      BASE: origin/${{ github.base_ref || 'main' }}
      BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Make sure the base branch is there
        run: |
          git fetch --quiet origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}" || true
          git fetch --quiet origin main:refs/remotes/origin/main || true

      - name: "Windows build rule 21a: no thread or mutex use in Windows code (fatal)"
        run: python3 scripts/branch_lint.py includes --base "$BASE" --head HEAD

      - name: "Secrets (fatal)"
        if: always()
        run: python3 scripts/branch_lint.py secrets --base "$BASE" --head HEAD

      - name: "No built programs or big binary files in git (fatal)"
        if: always()
        run: python3 scripts/branch_lint.py binaries --base "$BASE" --head HEAD

      # Claims live on issue #422 and name branches of this repo, so a fork's pull request has none to check.
      - name: "Claims: do not push into another lane's open claim (fatal)"
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          rc=0
          python3 scripts/collision_check.py --base "$BASE" --branch "${BRANCH}" > collision.md || rc=$?
          cat collision.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: "Docs changed with the code (warning)"
        if: always()
        run: python3 scripts/branch_lint.py docs --base "$BASE" --head HEAD

      - name: "Feature map regenerated (warning)"
        if: always()
        run: |
          if ! python3 scripts/gen_feature_map.py --check; then
            echo "::warning title=Feature map::docs/FEATURE_MAP.md is out of date. Run: python3 scripts/gen_feature_map.py (rule 5). If main changed the map after you branched, merge main first."
          fi

      - name: "UI catalogue regenerated (warning)"
        if: always()
        run: |
          if ! python3 scripts/gen_ui_catalogue.py --check; then
            echo "::warning title=UI catalogue::docs/ui_catalogue.md is out of date. Run: python3 scripts/gen_ui_catalogue.py"
          fi

      - name: "Bug-class patterns (warning)"
        if: always()
        run: python3 scripts/bug_patterns.py --base "$BASE" --head HEAD --github | tee bug_patterns.txt

      - name: "Are engine files changed? (decides whether to install MinGW)"
        if: always()
        id: eng
        run: |
          n=$(git diff --name-only "$BASE"...HEAD -- 'engine/**.hpp' 'engine/**.h' 'engine/**.cpp' | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Install the MinGW compiler (same way as release.yml, only when engine files changed)
        if: always() && steps.eng.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          bash scripts/ci-apt-mirror.sh || true
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT install -y --no-install-recommends g++-mingw-w64-x86-64 mingw-w64-x86-64-dev

      - name: "MinGW -fsyntax-only on changed engine files (warning)"
        if: always() && steps.eng.outputs.count != '0'
        continue-on-error: true
        run: python3 scripts/branch_lint.py mingw --base "$BASE" --head HEAD
