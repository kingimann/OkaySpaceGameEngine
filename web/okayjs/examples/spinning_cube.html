<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>okay.js spinning cube</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2330; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #error { position: fixed; inset: auto 16px 16px 16px; color: #ffb4a8; font: 14px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="error"></div>
<script type="module">
// A lit cube turned by a game script (scripts/spin.js, which uses only the engine's script API), a floor, and a
// 2D sprite drawn by a second, orthographic camera. ?webgl=1 asks for WebGL 1.
import { Game, Mesh, LitMaterial, UnlitMaterial, MeshRenderer, SpriteRenderer, Camera, Light, Texture, Vector2, Vector3,
         Quaternion, Color } from '../okay.js';

const params = new URLSearchParams(location.search);
const canvas = document.getElementById('view');
try {
    const game = new Game({ canvas, renderer: { webgl: params.get('webgl') ? Number(params.get('webgl')) : 'auto',
                                                preserveDrawingBuffer: params.has('test') } });
    const scene = game.scene;

    const cameraObject = scene.CreateGameObject('Main Camera');
    const camera = cameraObject.AddComponent(Camera, { fieldOfView: 50, nearClip: 0.1, farClip: 100, cullingMask: 1 });
    cameraObject.transform.position = new Vector3(0, 0.8, 4);
    // a camera looks down its own -Z (as the engine's do), so its +Z points from the cube back to the camera
    cameraObject.transform.rotation = Quaternion.LookRotation(new Vector3(0, 0.8, 4));

    const sun = scene.CreateGameObject('Sun');
    sun.AddComponent(Light, { intensity: 1.1, ambient: 0.25 });
    sun.transform.eulerAngles = new Vector3(40, 155, 0);   // shines down and away from the camera

    const cube = scene.CreateGameObject('Cube');
    cube.AddComponent(MeshRenderer, Mesh.Box(1.4, 1.4, 1.4), new LitMaterial({ color: Color.Parse('#e8743b'), shininess: 48 }));

    const floor = scene.CreateGameObject('Floor');
    floor.AddComponent(MeshRenderer, Mesh.Plane(8, 8, 4), new LitMaterial({ color: Color.Parse('#4a5468') }));
    floor.transform.position = new Vector3(0, -1.3, 0);

    // the 2D path: an orthographic camera on layer 1 that clears only depth, and a sprite with a picture drawn here
    const hudCamera = scene.CreateGameObject('HUD Camera').AddComponent(Camera, {
        projection: 'orthographic', orthographicSize: 5, depth: 1, clearFlags: 'depthOnly', cullingMask: 2 });
    hudCamera.transform.position = new Vector3(0, 0, 10);
    const label = document.createElement('canvas');
    label.width = 256; label.height = 64;
    const c2d = label.getContext('2d');
    c2d.fillStyle = 'rgba(20, 24, 34, 0.85)'; c2d.fillRect(0, 0, 256, 64);
    c2d.fillStyle = '#9fe0a8'; c2d.font = 'bold 34px sans-serif'; c2d.textBaseline = 'middle'; c2d.fillText('okay.js', 18, 33);
    const badge = scene.CreateGameObject('Badge');
    badge.layer = 1;
    badge.AddComponent(SpriteRenderer, { texture: new Texture(label), size: new Vector2(3, 0.75) });
    // keeps the badge in the top-left corner whatever the canvas shape (a script class handed over directly)
    game.AddScript(badge, class Corner {
        Update() {
            const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
            this.transform.position = new Vector3(-5 * aspect + 1.8, 4.4, 0);
        }
    });

    const spin = await (await fetch('scripts/spin.js')).text();
    const script = game.AddScript(cube, spin, { name: 'spin.js' });
    game.start();
    canvas.focus();
    window.okayExample = { game, cube, script, camera, ready: true };
} catch (e) {
    document.getElementById('error').textContent = e.message;
    window.okayExample = { error: e.message };
}
</script>
</body>
</html>
