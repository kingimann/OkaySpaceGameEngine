name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# A new push to a pull request cancels that PR's older run, so stale runs don't
# hold the runners. Each push to main keeps its own run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Ubuntu)
    runs-on: ubuntu-latest
    # The compiler cache makes a warm run recompile only what changed. The player and
    # editor builds are their own jobs below so they run in parallel with this one.
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # No CCACHE_BASEDIR: it makes ccache hand the compiler relative source paths, so __FILE__ is relative
      # and tests that find files next to their source (test_project_state) fail.
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-ubuntu-ci-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-ci-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The player and editor builds used to run after the tests in the one job above,
  # which added their build times together (about 75 minutes). They are separate
  # jobs now, so the three builds run side by side and a run takes as long as the
  # slowest one. Each keeps its own compiler cache.
  player:
    name: Build player runtime (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-ubuntu-player-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-player-

      # Compile the standalone player (engine + SDL2, no ImGui) so player
      # regressions are caught — the default build leaves it off.
      - name: Build player runtime
        run: |
          cmake -S . -B build-player -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_PLAYER=ON -DOKAY_BUILD_TESTS=OFF \
            -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-player -j

      - name: Upload player runtime
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-ci-player
          path: build-player/bin/okay-player
          retention-days: 1

  editor:
    name: Build & self-test editor (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-ubuntu-editor-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-editor-

      # Build the editor (Dear ImGui + SDL2) and run its headless self-test so
      # editor regressions are caught. --selftest returns before any SDL/display
      # use, so it runs on the CI box with no GPU.
      - name: Build & self-test editor
        run: |
          cmake -S . -B build-editor -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_EDITOR=ON -DOKAY_BUILD_TESTS=OFF \
            -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-editor -j
          ./build-editor/bin/OkayEngine --selftest

      - name: Upload editor
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-ci-editor
          path: build-editor/bin/OkayEngine
          retention-days: 1

  # Export a small game with the editor's real Build and run it headless: its
  # visual scripts must print exactly tests/export/expected.txt. The Windows
  # jobs below run the same check on Windows. Runs once the player and editor
  # builds above have finished.
  export-check:
    name: Export a game and check its visual scripts (Ubuntu)
    needs: [player, editor]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: ubuntu-ci-player
          path: bin
      - uses: actions/download-artifact@v6
        with:
          name: ubuntu-ci-editor
          path: bin

      - name: Export a game and check its visual scripts
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          chmod +x bin/okay-player bin/OkayEngine
          tests/export/verify.sh bin/OkayEngine

      # The build pipeline's output layout: <Name>.exe + <Name>_Data/, only the assets the scene uses,
      # StreamingAssets, build.json; an old flat build still runs; compact, zip and dry-run output.
      - name: Check the build output layout
        run: tests/export/verify_layout.sh bin/OkayEngine

  # Build the scripting, visual-scripting and robustness tests with
  # AddressSanitizer and UndefinedBehaviorSanitizer and run them: any memory
  # error, leak or undefined behaviour fails the job. Several robustness tests
  # only catch their bug under a sanitizer. Only the listed test targets are built, to
  # keep it fast; this is deliberately not the whole ctest suite.
  sanitizers:
    name: Scripting and robustness tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev

      # The runner kernel's high mmap randomness can break ASan's shadow memory
      # setup (random "DEADLYSIGNAL" crashes before main); 28 bits is safe.
      - name: Make ASan's address layout reliable
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # -g1: line tables are enough for file:line in sanitizer stack traces and
      # keep the Debug objects a fraction of the size of full -g.
      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS_DEBUG=-g1 \
            -DOKAY_SANITIZE=address,undefined,float-cast-overflow -DOKAY_BUILD_TESTS=ON \
            -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_USE_SODIUM=OFF

      # Every test_script_* target is picked up from tests/CMakeLists.txt, so new
      # script tests join this job without editing it.
      - name: List the tests
        run: |
          TESTS="test_visualscript test_vs_nodes test_vs_types test_okayscript_next test_scripting"
          TESTS="$TESTS $(grep -oE 'add_executable\(test_script_[A-Za-z0-9_]+' tests/CMakeLists.txt | cut -c16- | tr '\n' ' ')"
          if grep -q 'add_executable(test_vs_editor_model' tests/CMakeLists.txt; then TESTS="$TESTS test_vs_editor_model"; fi
          # Robustness tests whose bugs only show up under a sanitizer.
          TESTS="$TESTS test_anim_sm_realloc test_prefs_misc test_loaders_robust test_scene_records"
          TESTS="$TESTS test_physics_callback_removal test_physics_nan test_parent_cycles test_scheduler_reentry"
          # Model-file readers fed hostile input: memory errors in the FBX / OBJ / STL / PLY /
          # glTF / Collada parsers only show under a sanitizer.
          for t in test_fbx_hostile test_model_readers test_model_readers_fuzz test_collada_reader test_glb_container; do
            if grep -q "add_executable($t " tests/CMakeLists.txt; then TESTS="$TESTS $t"; fi
          done
          for t in test_net_hardening test_net_races; do
            if grep -q "add_executable($t " tests/CMakeLists.txt; then TESTS="$TESTS $t"; fi
          done
          echo "SAN_TESTS=$TESTS" >> "$GITHUB_ENV"
          echo "$TESTS"

      # Capped at 3 parallel jobs: with an unbounded -j the runner was shut down mid-link
      # (out of memory) on most runs, because every sanitized test executable links the
      # whole sanitized engine.
      - name: Build
        run: cmake --build build-asan -j 3 --target $SAN_TESTS

      - name: Test
        working-directory: build-asan/tests
        run: |
          failed=""
          for t in $SAN_TESTS; do
            echo "== $t"
            "./$t" || failed="$failed $t"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  # The model readers with Assimp compiled in (OKAY_USE_ASSIMP=ON), which no other job
  # builds: ModelImportAssimp.cpp is compiled and the reader tests that compare the
  # built-in readers with Assimp's run. Only the model test targets are built. Assimp's
  # source is cloned once into the Actions cache (the tag is read from engine/CMakeLists.txt)
  # and its objects come from ccache. The built-in-reader switches stay at their defaults.
  assimp-models:
    name: Model readers with Assimp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Find the Assimp version
        run: echo "ASSIMP_TAG=$(grep -oE 'GIT_TAG +v[0-9.]+' engine/CMakeLists.txt | head -n1 | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Restore the Assimp source
        id: assimp-src
        uses: actions/cache@v5
        with:
          path: ~/assimp-src
          key: assimp-src-${{ env.ASSIMP_TAG }}

      - name: Fetch Assimp
        if: steps.assimp-src.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$ASSIMP_TAG" https://github.com/assimp/assimp.git "$HOME/assimp-src"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-assimp-${{ github.sha }}
          restore-keys: ccache-assimp-

      - name: Configure
        run: |
          cmake -S . -B build-assimp -G Ninja -DCMAKE_BUILD_TYPE=Release -DOKAY_USE_ASSIMP=ON \
            -DFETCHCONTENT_SOURCE_DIR_ASSIMP="$HOME/assimp-src" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF \
            -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_USE_SODIUM=OFF

      - name: Build
        run: |
          cmake --build build-assimp -j --target test_model_readers test_model_readers_fuzz test_collada_reader \
            test_model_import_rig test_gltf_import test_fbx_reader test_glb_container

      - name: Test
        run: ctest --test-dir build-assimp --output-on-failure -R '^(model_readers|model_readers_fuzz|collada_reader|model_import_rig|gltf_import|fbx_reader|glb_container)$'

  # Our own HTTP client (docs/own_http_client.md) with the CMake option on. NOT required for merging and the
  # option stays OFF by default everywhere else. Only the two header-only test targets are built (the client
  # does not link the engine). OKAY_REQUIRE_TLS_TESTS=1 makes a skipped TLS case (no libssl, no openssl program)
  # a failure, so the certificate checks cannot silently go missing. The sanitizer script then runs both tests
  # under ASan and UBSan.
  own-http:
    name: Own HTTP client (OKAY_OWN_HTTP=ON, TLS tests required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev openssl libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build-http -G Ninja -DCMAKE_BUILD_TYPE=Release -DOKAY_OWN_HTTP=ON \
            -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_USE_SODIUM=OFF
          # the option must reach the engine as a compile definition
          grep -q 'OKAY_OWN_HTTP=1' build-http/build.ninja

      - name: Build
        run: cmake --build build-http -j2 --target test_own_http test_own_http_net

      - name: Test (a skipped TLS case fails)
        env:
          OKAY_REQUIRE_TLS_TESTS: "1"
        run: ctest --test-dir build-http --output-on-failure -R '^(own_http|own_http_net)$'

      - name: Sanitizers (ASan + UBSan)
        env:
          OKAY_REQUIRE_TLS_TESTS: "1"
        run: scripts/own_http_sanitized.sh 100000

  # Cross-compile the Windows editor + player (the release build) and the
  # visual-scripting and mesh file tests, for the windows-export job to run on real Windows.
  windows-cross:
    name: Cross-compile Windows build (MinGW)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SDL2_VERSION: 2.30.9
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6

      # The runner's Ubuntu mirror is sometimes slow enough that downloading the
      # MinGW compiler outlasts the step timeout. Downloaded packages go in the
      # Actions cache, saved even when the install times out, so each run starts
      # from what earlier runs fetched instead of from the mirror.
      - name: Note the runner image
        run: echo "RUNNER_IMAGE=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore downloaded apt packages
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-${{ env.RUNNER_IMAGE }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-mingw-${{ env.RUNNER_IMAGE }}-

      - name: Install toolchain
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          ls ~/apt-cache/*.deb 2>/dev/null | wc -l > ~/apt-debs-before
          bash scripts/ci-apt-mirror.sh
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives=$HOME/apt-cache"
          for i in 1 2 3; do
            if timeout 240 sudo apt-get $APT update && \
               timeout 600 sudo apt-get $APT install -y --no-install-recommends cmake ninja-build g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev ccache; then
              exit 0
            fi
            echo "apt attempt $i failed or timed out; retrying"
            sleep 10
          done
          exit 1

      - name: Check for newly downloaded apt packages
        id: apt-new
        if: always()
        run: |
          [ -d ~/apt-cache ] || exit 0
          # A timed-out install can leave apt-get still downloading.
          sudo pkill -x apt-get || true
          sudo chown -R "$USER" ~/apt-cache
          rm -rf ~/apt-cache/partial ~/apt-cache/lock
          if [ "$(ls ~/apt-cache/*.deb 2>/dev/null | wc -l)" -gt "$(cat ~/apt-debs-before 2>/dev/null || echo 0)" ]; then
            echo "save=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Save downloaded apt packages
        if: always() && steps.apt-new.outputs.save == '1'
        uses: actions/cache/save@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-${{ env.RUNNER_IMAGE }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fetch SDL2 and libsodium (MinGW)
        run: |
          bash scripts/fetch-tarball.sh sdl2-mingw.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz" \
            "https://www.libsdl.org/release/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          mkdir -p sdl2-mingw && tar xzf sdl2-mingw.tar.gz -C sdl2-mingw --strip-components=1
          echo "SDL2_MINGW_PREFIX=$PWD/sdl2-mingw/x86_64-w64-mingw32" >> "$GITHUB_ENV"
          bash scripts/fetch-tarball.sh libsodium-mingw.tar.gz \
            "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable-mingw.tar.gz"
          mkdir -p libsodium-mingw && tar xzf libsodium-mingw.tar.gz -C libsodium-mingw
          echo "OKAY_SODIUM_MINGW_PREFIX=$PWD/libsodium-mingw/libsodium-win64" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-mingw-ci-${{ github.sha }}
          restore-keys: |
            ccache-mingw-ci-
            ccache-mingw-

      - name: Build the Windows distribution
        run: scripts/build-windows-dist.sh

      - name: Build the visual-scripting and mesh file tests for Windows
        run: |
          cmake -S . -B build-win-tests -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF \
            -DOKAY_BUILD_PLAYER=OFF -DOKAY_BUILD_EDITOR=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$SDL2_MINGW_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH="/usr/x86_64-w64-mingw32;$SDL2_MINGW_PREFIX" \
            -DOKAY_SODIUM_PREFIX="$OKAY_SODIUM_MINGW_PREFIX"
          cmake --build build-win-tests -j --target test_vs_acceptance test_vs_debug test_game_fiber \
            test_polymesh test_mesh_asset test_poly_ops
          mkdir -p win-tests
          cp build-win-tests/tests/test_vs_acceptance.exe build-win-tests/tests/test_vs_debug.exe \
             build-win-tests/tests/test_game_fiber.exe build-win-tests/tests/test_polymesh.exe \
             build-win-tests/tests/test_mesh_asset.exe build-win-tests/tests/test_poly_ops.exe \
             "$SDL2_MINGW_PREFIX/bin/SDL2.dll" win-tests/

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: windows-ci-build
          path: |
            build-win-dist/Tools/
            win-tests/
          retention-days: 3

  # On a real Windows machine: run the visual-scripting tests (including the
  # Windows fiber the editor's debugger uses) and the mesh file tests, then
  # export a game with the Windows editor and check what its visual scripts print.
  windows-export:
    name: Windows export check
    needs: windows-cross
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          name: windows-ci-build
          path: winbuild

      - name: Run the visual-scripting and mesh file tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in "test_vs_acceptance", "test_vs_debug", "test_game_fiber", "test_polymesh", "test_mesh_asset", "test_poly_ops") {
            Write-Host "== $t"
            & "winbuild/win-tests/$t.exe"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      - name: Export a game and check its visual scripts
        shell: pwsh
        run: ./tests/export/verify.ps1 -Editor winbuild/build-win-dist/Tools/OkayEngine.exe -Work "$env:RUNNER_TEMP/export"

  # Real Windows process restart: the test holds a named mutex and a file lock
  # (the same kind of single-instance lock the launcher uses), exits, and the
  # helper must start the new process once. The install path is
  # "Program Files (x86)" and the new process must still see --launcher plus
  # an argument that itself contains spaces and parentheses. The same job runs
  # the verified restart (a new file that is the wrong version or cannot start is
  # rolled back and the previous program is started) and the self-update rules.
  windows-restart:
    name: Windows updater restart
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF
          -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_BUILD_EDITOR=OFF
          -DOKAY_BUILD_PLAYER=OFF -DOKAY_USE_SODIUM=OFF

      - name: Build the restart test
        run: cmake --build build --config Release --target test_app_restart test_self_update --parallel

      - name: Run the restart and self-update tests
        # app_restart also drives the verified restart with real processes: self-check, rollback to the previous launcher file, state file.
        # --timeout: a hang in a real-process case fails in 150 s with its output instead of using the whole 30 minutes; -V prints each case as it runs.
        run: ctest --test-dir build -C Release -R "^(app_restart|self_update)$" --output-on-failure --timeout 150 -V

  web-build:
    name: WebGL build (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pull in Emscripten. This runner has network, so Emscripten's SDL2 port is
      # fetched + cached here (the one online step the web build needs).
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: 3.1.51
          actions-cache-folder: emsdk-cache

      # Compile the player to WebAssembly/WebGL via the same script the editor's
      # "Build ▸ Web" export writes, so a broken web build fails CI (it silently
      # rotted before — the engine didn't even compile under Emscripten's Clang).
      - name: Build WebGL player
        run: bash scripts/build-web.sh

      - name: Verify wasm output
        run: |
          test -f build-web/web/okay-player.html
          test -f build-web/web/okay-player.wasm
          ls -la build-web/web/

      - name: Upload WebGL build
        uses: actions/upload-artifact@v6
        with:
          name: okayspace-webgl
          path: build-web/web/
