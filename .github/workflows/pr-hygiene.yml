# PR hygiene (CLAUDE.md rule 4a, docs/collaboration.md): a PR body needs a "How to try it" section that says something.
# Small and cheap on purpose (no build). Re-runs when the PR text is edited. Docs-only PRs may write
# "Nothing to run: read <file>". Draft PRs are checked too: write the section when you open the PR.
name: PR hygiene
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  how-to-try-it:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: The PR body has a "How to try it" section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_pr_body.py --base "$BASE_SHA" --head "$HEAD_SHA"
