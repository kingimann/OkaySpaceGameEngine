name: Release Windows build

# Cross-compiles the Windows distribution (launcher, editor, player + SDL2.dll)
# from Linux with MinGW-w64 and publishes it as a GitHub Release. Triggers on a
# version tag, or on demand via "Run workflow" — the manual run tags + releases
# the version in dist/VERSION.txt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: >-
          latest = a normal release (becomes the GitHub "latest" release and the
          update feed's VERSION.txt). lts = a patch of the long-term-support line,
          run on its lts/<line> branch: published as LTS.txt, never "latest"
          (see docs/release/release_channels.md).
        type: choice
        options: [latest, lts]
        default: latest
  # Called by fast-release.yml (docs/release/releasing.md). stamp_version is the version to build; it is empty on every other kind of run,
  # and every step marked "fast release" below is skipped then, so the old path is exactly what it was.
  workflow_call:
    inputs:
      channel:
        type: string
        default: latest
      stamp_version:
        type: string
        default: ''

permissions:
  contents: write          # needed to attach assets to a Release
  actions: read            # the Windows job reads this run's artifacts/jobs to pick up the Linux server build

# Only one release run at a time (CLAUDE.md rules 12 and 13): a second run for the same or another version waits for the first
# to finish instead of racing it for the tag, the assets, versions.json and the "latest" mark. Never cancelled midway: a
# half-published release is worse than a waiting one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows-exe:
    name: Cross-compile Windows exes (MinGW)
    runs-on: ubuntu-latest
    # A normal release takes ~11 min; never let a stuck download hold one for hours.
    # (Includes the last step, which waits for the Linux server build that runs beside this job.)
    timeout-minutes: 90   # build jobs are capped by memory (build-windows-dist.sh), so a cold build takes longer
    outputs:
      ver: ${{ steps.pkg.outputs.ver }}
    env:
      SDL2_VERSION: 2.30.9
      # Compiler cache kept between release builds (actions/cache below): only
      # changed files recompile, so a typical release builds in a few minutes.
      # No CCACHE_SLOPPINESS here: a file that uses __TIME__ (editor/BuildStamp.cpp) is always recompiled, so the stamp is exact.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
      # "true" when the repo has the secret that the Supabase publish step needs.
      SUPABASE_PUBLISH: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
      # "true" when the repo has the repository secret OKAY_UPDATE_SIGNING_SEED (the PRIVATE update-signing key; the owner adds it in
      # Settings > Secrets and variables > Actions > Secrets; docs/online/security.md "Updater signing"). Without it the steps that use it are skipped.
      UPDATE_SIGNING: ${{ secrets.OKAY_UPDATE_SIGNING_SEED != '' }}
      # The launcher's trusted anti-cheat keys: public keys, so a repository
      # variable (Settings > Secrets and variables > Actions > Variables).
      OKAY_AC_TRUSTED_KEYS: ${{ vars.OKAY_AC_TRUSTED_KEYS }}
      # The updater's trusted signing keys (public; docs/release/updater.md "Signed releases"). Empty = unsigned feeds still accepted.
      OKAY_UPDATE_TRUSTED_KEYS: ${{ vars.OKAY_UPDATE_TRUSTED_KEYS }}
      # The account/update server baked into the programs comes from config/public-account.json (docs/online/accounts.md); these
      # optional repository variables override it (empty = use the file).
      # OKAY_REQUIRE_ACCOUNT=1 makes build-windows-dist.sh stop if neither the file nor the variables give both values, so a release never ships offline.
      OKAY_DEFAULT_ACCOUNT_URL: ${{ vars.OKAY_DEFAULT_ACCOUNT_URL }}
      OKAY_DEFAULT_ACCOUNT_KEY: ${{ vars.OKAY_DEFAULT_ACCOUNT_KEY }}
      OKAY_REQUIRE_ACCOUNT: "1"
    steps:
      - uses: actions/checkout@v6

      # FAST RELEASE ONLY (skipped unless fast-release.yml passes stamp_version). The version is put into THIS runner's copy of
      # CMakeLists.txt (never committed), so the programs, VERSION.txt, the zip name, the tag and versions.json all carry it. The
      # assembled changelog replaces dist/CHANGELOG.txt, which this workflow attaches to the release.
      - name: Fast release - fetch the prepared release notes
        if: inputs.stamp_version
        uses: actions/download-artifact@v6
        with:
          name: release-notes
          path: release-notes
      - name: Fast release - put the new version and changelog into this build
        if: inputs.stamp_version
        env:
          STAMP_VERSION: ${{ inputs.stamp_version }}
        run: |
          python3 -I scripts/fast_release.py stamp --version "$STAMP_VERSION"
          cp release-notes/CHANGELOG.txt dist/CHANGELOG.txt
          echo "NOTES_FILE=$PWD/release-notes/NOTES.txt" >> "$GITHUB_ENV"
          git diff --stat
      # A version is released once (CLAUDE.md rule 12): running this again for a version that already has a GitHub release would
      # rebuild the programs and change their checksums. Stop here, before anything is built, if v<version> already has a release.
      # The version is read the same way build-windows-dist.sh reads it. If GitHub cannot be asked, this fails (it does not guess).
      - name: Refuse a version that is already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(grep -m1 -oE 'VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')"
          if [ -z "$VER" ]; then echo "::error::could not read the version from CMakeLists.txt"; exit 1; fi
          rc=0
          out="$(gh release view "v$VER" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft 2>&1)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error title=v$VER is already released::GitHub already has a release for v$VER ($out). Never re-run the release for a version that exists: it rebuilds the programs and changes their checksums. Bump the version in CMakeLists.txt instead."
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qi "release not found"; then
            echo "::error title=Could not check for an existing release::gh said: $out"
            exit 1
          fi
          echo "v$VER has no release yet: continuing."

      # Without keys the launcher can't tell the official game's signed build
      # from an edited one: its anti-cheat checks are only telemetry. A warning
      # for now; once the variable is set this becomes a failure.
      - name: Check the launcher's trusted anti-cheat keys
        run: |
          if [ -z "$OKAY_AC_TRUSTED_KEYS" ]; then
            echo "::warning title=No trusted anti-cheat keys::OKAY_AC_TRUSTED_KEYS (repository variable) is empty: this launcher won't verify who signed the official game."
            echo "**Warning:** no trusted anti-cheat keys (repository variable \`OKAY_AC_TRUSTED_KEYS\` is empty). The launcher's integrity checks on the official game are telemetry only in this release." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The toolchain (.deb files) lives in the Actions cache, keyed on the Ubuntu release, not on the runner image version (a
      # new image used to start with nothing and download 161 MB from a mirror that sometimes crawls; one release sat 45 min).
      # scripts/ci-install-mingw.sh installs from the cache with no network when it can, else downloads only what is missing
      # (several files at once, retried, a second mirror), and fails unless the compiler is the win32 thread model (CLAUDE.md
      # rule 21a; the posix model is not installed and nothing in the release uses it). zip, nsis and osslsigncode are the
      # release's packaging tools. The release has its own key prefix; it falls back to the PR check's cache (same compiler).
      - name: Note the Ubuntu release
        run: echo "UBUNTU_CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")" >> "$GITHUB_ENV"

      - name: Restore downloaded apt packages
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-win32-release-${{ env.UBUNTU_CODENAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-mingw-win32-release-${{ env.UBUNTU_CODENAME }}-
            apt-mingw-win32-${{ env.UBUNTU_CODENAME }}-
            apt-mingw-

      - name: Install toolchain
        id: install
        timeout-minutes: 20
        run: |
          bash scripts/ci-apt-cache.sh before
          bash scripts/ci-install-mingw.sh zip nsis osslsigncode

      - name: Check for newly downloaded apt packages
        id: apt-new
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: bash scripts/ci-apt-cache.sh after "$INSTALL_OUTCOME"

      - name: Save downloaded apt packages
        if: always() && steps.apt-new.outputs.save == '1'
        uses: actions/cache/save@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-win32-release-${{ env.UBUNTU_CODENAME }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fetch SDL2 (MinGW dev)
        run: |
          bash scripts/fetch-tarball.sh sdl2-mingw.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz" \
            "https://www.libsdl.org/release/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          mkdir -p sdl2-mingw
          tar xzf sdl2-mingw.tar.gz -C sdl2-mingw --strip-components=1
          echo "SDL2_MINGW_PREFIX=$PWD/sdl2-mingw/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      - name: Fetch libsodium (MinGW prebuilt)
        # Statically linked into the exes for authenticated packet encryption. A release MUST have it: the download is pinned
        # to a SHA-256 (scripts/libsodium-mingw.pin), the layout is checked, and the build passes -DOKAY_REQUIRE_SODIUM=ON
        # (scripts/build-windows-dist.sh), so a missing or different libsodium fails the release instead of building without it
        # (the code would fall back to our own, unreviewed okay::crypto; CLAUDE.md rule 18).
        run: |
          prefix="$(bash scripts/fetch-libsodium-mingw.sh "$PWD")"
          echo "OKAY_SODIUM_MINGW_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-mingw-${{ github.sha }}
          restore-keys: ccache-mingw-

      # A release never carries our own unreviewed crypto (OKAY_OWN_CRYPTO, OKAY_OWN_STACK_CRYPTO_TEST) or the own-stack
      # dogfood switch (OKAY_OWN_STACK). Checked here on the environment, and again by build-windows-dist.sh on the cmake cache.
      - name: Refuse own crypto and the own-stack switch
        run: |
          scripts/check_release_own_stack.sh
          test -n "$OKAY_SODIUM_MINGW_PREFIX" && test -s "$OKAY_SODIUM_MINGW_PREFIX/lib/libsodium.a"

      - name: Build Windows distribution
        # The account server + public key are baked into the build as the CMake
        # defaults (see the top-level CMakeLists), pointing at the OkaySpace
        # Supabase project. We intentionally do NOT override them from CI secrets
        # anymore: a stale/empty secret used to silently misconfigure the build
        # and break sign-in. To point a fork at a different server, change the
        # CMake defaults instead.
        run: |
          ccache -z || true
          scripts/build-windows-dist.sh
          ccache -s || true

      # Sign our own programs (not the third-party SDL2.dll) BEFORE anything records their checksum: the zip, the installer,
      # the GitHub assets and versions.json must all carry the same signed bytes. Without the two secrets this is skipped
      # with a warning (the release stays unsigned, as before); with them, any failure fails the release instead of
      # shipping unsigned. See docs/release/packaging.md "Code signing".
      - name: Sign the Windows programs
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          scripts/sign-windows.sh build-win-dist/OkaySpace.exe build-win-dist/Tools/OkayEngine.exe build-win-dist/Tools/OkaySpacePlayer.exe

      - name: Package zip
        id: pkg
        run: |
          VER=$(cat build-win-dist/VERSION.txt 2>/dev/null || echo dev)
          NAME="OkaySpace-windows-v${VER}"
          mkdir -p "$NAME"
          cp -r build-win-dist/* "$NAME"/
          zip -r "${NAME}.zip" "$NAME"
          echo "zip=${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer (NSIS)
        # One-click setup .exe that installs or updates in place (see the .nsi).
        # This is what the launcher's "download the installer" flow hands users.
        run: |
          # NSIS resolves a relative File path against the .nsi's own directory,
          # not the workspace, so pass an absolute DISTDIR (and OUTFILE).
          makensis -DVERSION="${{ steps.pkg.outputs.ver }}" \
                   -DDISTDIR="$PWD/build-win-dist" \
                   -DOUTFILE="$PWD/OkaySpace-Setup.exe" \
                   scripts/okayspace-installer.nsi
          ls -la OkaySpace-Setup.exe

      - name: Sign the Windows installer
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: scripts/sign-windows.sh OkaySpace-Setup.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.zip }}

      # FAST RELEASE ONLY: the programs must really carry the stamped version (the same check dev-build.yml makes), and the update
      # server's changelog for this version is the assembled one (publish-supabase.sh uploads build-win-dist/CHANGELOG.txt). Added
      # after the zip and installer are made, so neither of them changes.
      - name: Fast release - check the programs carry the version, add the changelog
        if: inputs.stamp_version
        env:
          STAMP_VERSION: ${{ inputs.stamp_version }}
          PKG_VER: ${{ steps.pkg.outputs.ver }}
        run: |
          [ "$PKG_VER" = "$STAMP_VERSION" ] || { echo "::error::the build says v$PKG_VER but v$STAMP_VERSION was asked for"; exit 1; }
          for f in build-win-dist/VERSION.txt build-win-dist/Tools/VERSION.txt; do
            [ "$(tr -d '\r\n ' < "$f")" = "$STAMP_VERSION" ] || { echo "::error::$f does not say $STAMP_VERSION"; exit 1; }
          done
          for f in build-win-dist/OkaySpace.exe build-win-dist/Tools/OkayEngine.exe; do
            LC_ALL=C grep -aqF -- "$STAMP_VERSION" "$f" || { echo "::error::$f does not contain $STAMP_VERSION, so it would fail its own start-up check"; exit 1; }
          done
          cp dist/CHANGELOG.txt build-win-dist/CHANGELOG.txt

      # On a tag push, release that tag. On a manual run, create/refresh a
      # release for the version in dist/VERSION.txt (the runner's GITHUB_TOKEN
      # can push the tag).
      # Upload the zip AND the individual files as release assets. The in-app
      # updater (launcher + editor) downloads the individual files from
      # releases/latest/download/<name>, so they must be present as assets.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Upload the individual files the in-app updater fetches by name from
          # releases/latest/download/<name>. The launcher + its SDL2.dll sit at the
          # dist root; the editor/player live in Tools/. softprops uses each file's
          # basename as the asset name, so these resolve to the URLs the updater uses.
          files: |
            ${{ steps.pkg.outputs.zip }}
            OkaySpace-Setup.exe
            build-win-dist/OkaySpace.exe
            build-win-dist/Tools/OkayEngine.exe
            build-win-dist/Tools/OkaySpacePlayer.exe
            build-win-dist/SDL2.dll
            build-win-dist/VERSION.txt
            build-win-symbols/OkayEngine.debug
            dist/CHANGELOG.txt
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.pkg.outputs.ver) }}
          # Tag the commit this run built. Without it a new tag lands on main's
          # head at publish time, which can include PRs merged during the build.
          target_commitish: ${{ github.sha }}
          name: OkaySpace v${{ steps.pkg.outputs.ver }}
          generate_release_notes: true
          # Fast release only: the notes players read come from the changelog entries (empty = none, as before).
          body_path: ${{ inputs.stamp_version && 'release-notes/body.md' || '' }}
          # An LTS patch must not become GitHub's "latest" release: the in-app
          # updater downloads releases/latest/download/<name> on the latest channel.
          # Never "latest" here. A launcher that reads releases/latest sees the version the moment it is "latest", and
          # refuses it when the checksum list (versions.json on Supabase) does not have it yet ("no checksum" error,
          # 2.866.0). The release is promoted to latest by the "Make the release visible" job below, only after the
          # checksums are published.
          make_latest: false

      # Also publish to the Supabase "releases" bucket (launchers check it first),
      # when the repo has a SUPABASE_SERVICE_KEY secret. Without it this is skipped.
      # The seed must make a public key the programs just built trust (OKAY_UPDATE_TRUSTED_KEYS), or every launcher would refuse this release.
      # Skipped when the secret is absent. (set -x is never on: the script refuses it while the seed is in scope.)
      - name: Check the update signing key
        env:
          OKAY_UPDATE_SIGNING_SEED: ${{ secrets.OKAY_UPDATE_SIGNING_SEED }}
        if: env.UPDATE_SIGNING == 'true' && env.SUPABASE_PUBLISH == 'true'
        run: scripts/sign-release.sh check-key

      - name: Publish to Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # publish-supabase.sh signs versions.json with this (scripts/sign_index.py) when it is set, and verifies the published pair.
          OKAY_UPDATE_SIGNING_SEED: ${{ secrets.OKAY_UPDATE_SIGNING_SEED }}
          SUPABASE_URL: ${{ vars.OKAY_DEFAULT_ACCOUNT_URL }}
          CHANNEL: ${{ inputs.channel || 'latest' }}
        if: env.SUPABASE_PUBLISH == 'true'
        run: scripts/publish-supabase.sh

      # FINALIZE (was the separate job "Make the release visible"; folded in so it does not wait for another runner: on v2.881.0 that
      # 13 s job queued 10.7 min). Nothing changed about WHEN a release becomes latest: only after (1) the Linux server build
      # passed and its file is attached, and (2) the checksums of all three programs are in versions.json. Any failure here leaves the
      # release hidden (make_latest is false everywhere else), exactly as the old job's failure did.
      - name: Wait for the Linux server build, attach okay-server-linux-x64
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          VER: ${{ steps.pkg.outputs.ver }}
          TAG_REF: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          TAG="${TAG_REF:-v$VER}"
          # Poll every 20 s. The Linux job usually finished long ago (about 4-11 min against 8-28 for this job).
          deadline=$(( $(date +%s) + 35*60 ))
          while :; do
            n="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=okay-server-linux-x64" --jq '[.artifacts[] | select(.expired == false)] | length')" || n=0
            [ "$n" -ge 1 ] && break
            # Stop at once if the Linux job already failed or was cancelled: no artifact will ever come.
            st="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.name | test("Linux game server")) | .conclusion] | first // ""')" || st=""
            case "$st" in
              failure|cancelled|timed_out|skipped) echo "::error title=Linux server build did not pass::The Linux game server job ended as '$st', so v$VER is NOT marked latest (no okay-server-linux-x64). Fix it on main and make a new release; never re-run this version (rule 12)."; exit 1 ;;
            esac
            [ "$(date +%s)" -lt "$deadline" ] || { echo "::error title=Linux server build missing::No okay-server-linux-x64 artifact after 35 min. v$VER is NOT marked latest."; exit 1; }
            echo "waiting for the Linux server build..."; sleep 20
          done
          mkdir -p linux-server-dl
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n okay-server-linux-x64 -D linux-server-dl
          test -s linux-server-dl/okay-server-linux-x64
          gh release upload "$TAG" linux-server-dl/okay-server-linux-x64 --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx okay-server-linux-x64
          echo "okay-server-linux-x64 is attached to $TAG."

      - name: Check the checksums are published, then mark the release latest
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pkg.outputs.ver }}
          HAVE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
          SUPABASE_URL: ${{ vars.OKAY_DEFAULT_ACCOUNT_URL }}
          CHANNEL: ${{ inputs.channel || 'latest' }}
        run: |
          . scripts/public-account.sh
          SUPABASE_URL="${SUPABASE_URL:-$(okay_public_account url)}"
          if [ "$HAVE_KEY" != "true" ]; then
            msg="v$VER was built and attached to its GitHub release, but its checksums were NOT published (no SUPABASE_SERVICE_KEY secret), so launchers would refuse it. It is not marked latest. Run scripts/publish-supabase.sh with a key (or scripts/release-local.sh), then: gh release edit v$VER --latest"
            echo "::error title=Release not visible to launchers::$msg"
            echo "**$msg**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          B="${SUPABASE_URL%/}/storage/v1/object/public/releases"
          # The checksum list must really contain this version with a checksum for each program, not just exist.
          for i in $(seq 1 30); do  # up to about 5 minutes: the release server can lag behind the upload (2.883.0 needed more than 60 s)
            if curl -fsS "$B/versions.json" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          v = [x for x in d.get('versions', []) if x.get('version') == '$VER']
          ok = bool(v) and all((v[0].get('files', {}).get(n) or {}).get('sha256') for n in ('OkaySpace.exe', 'OkayEngine.exe', 'OkaySpacePlayer.exe'))
          sys.exit(0 if ok else 1)"; then ok=1; break; fi
            echo "versions.json has no checksums for v$VER yet (attempt $i)"; sleep 10
          done
          if [ "${ok:-0}" != "1" ]; then
            echo "::error title=Checksums missing::versions.json on the release server has no checksums for v$VER, so the release stays hidden. Run scripts/publish-supabase.sh, then: gh release edit v$VER --latest"
            exit 1
          fi
          if [ "$CHANNEL" = "lts" ]; then echo "LTS patch: left as a normal release (never latest)"; exit 0; fi
          gh release edit "v$VER" --repo "$GITHUB_REPOSITORY" --latest
          echo "v$VER is now the latest release, with checksums published." >> "$GITHUB_STEP_SUMMARY"

      # The public downloads (installer, zip, Linux game server) go to the releases bucket too, so nobody needs GitHub to get them
      # (owner decision 2026-11-20): releases/v<ver>/<file>, and releases/latest/<file> when this is the newest release. After the
      # checksums are published and okay-server-linux-x64 is downloaded (the two steps above), so latest/ never points at a hidden release.
      - name: Publish the public downloads to Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ vars.OKAY_DEFAULT_ACCOUNT_URL }}
          VER: ${{ steps.pkg.outputs.ver }}
          CHANNEL: ${{ inputs.channel || 'latest' }}
        if: env.SUPABASE_PUBLISH == 'true'
        run: scripts/publish-supabase-downloads.sh

  # The Linux game server: the player runtime built for Linux, which runs games
  # headless with --server. The editor's "Dedicated Server" export downloads it
  # (releases/latest/download/okay-server-linux-x64) to make a Linux server
  # folder from Windows. Built on 22.04 so it runs on most VPS distros (glibc 2.35+).
  #
  # It runs BESIDE the Windows job (it does not need its version: it never touches the release itself). It uploads the file as a
  # run artifact; the last step of the Windows job attaches it to the release and only then marks the release latest, so the
  # server file is still always there before "latest" (issue #975). No race over who creates the release object.
  linux-server:
    name: Build the Linux game server
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        timeout-minutes: 20
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            if timeout 120 sudo apt-get $APT update && \
               timeout 240 sudo apt-get $APT install -y --no-install-recommends cmake ninja-build g++ libsdl2-dev libsodium-dev ccache; then
              exit 0
            fi
            echo "apt attempt $i failed or timed out; retrying"
            sleep 10
          done
          exit 1

      # Same rule as ci.yml (#953): every run restores, only a run from main saves (a release from a tag or a branch never writes one).
      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-linux-server-${{ github.sha }}
          restore-keys: ccache-linux-server-

      - name: Build the server runtime
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DOKAY_BUILD_PLAYER=ON -DOKAY_BUILD_EDITOR=OFF -DOKAY_BUILD_LAUNCHER=OFF \
                -DOKAY_BUILD_TESTS=OFF -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_TOOLS=OFF \
                -DOKAY_REQUIRE_SODIUM=ON
          scripts/check_release_own_stack.sh --cache build-linux
          ccache -z || true
          cmake --build build-linux --target okay-player
          ccache -s || true
          scripts/check_release_own_stack.sh --binary build-linux/bin/okay-player
          cp build-linux/bin/okay-player okay-server-linux-x64
          strip okay-server-linux-x64
          ./okay-server-linux-x64 --help | head -n 3

      - name: Save compiler cache (main only)
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-linux-server-${{ github.sha }}

      # Last step on purpose: the Windows job treats "the artifact exists" as "the build passed and the checks ran".
      - name: Keep the server for the Windows job
        uses: actions/upload-artifact@v6
        with:
          name: okay-server-linux-x64
          path: okay-server-linux-x64
          retention-days: 1
          if-no-files-found: error
