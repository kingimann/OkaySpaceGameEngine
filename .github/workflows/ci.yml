name: CI

on:
  push:
    branches: [ main ]
  # Pull requests run only the Windows cross-compile here (and branch-lint's quick checks): the full build and tests are
  # run by the author before the push (scripts/precheck.sh --tests, CLAUDE.md rule 7a), and the whole suite runs on every
  # push to main and once a night (owner, 2026-11-23).
  pull_request:
  schedule:
    - cron: "23 6 * * *"   # nightly full suite on main
  # Manual run on a branch: lets the MSVC job (skipped on pull requests) be run on demand to read real MSVC errors.
  # With pr_check_only, only the jobs a pull request runs are run (the Windows cross-compile), to time or test that check
  # on a branch without starting the whole suite.
  workflow_dispatch:
    inputs:
      pr_check_only:
        description: "Run only the pull-request check (Cross-compile Windows build), not the full suite"
        type: boolean
        default: false

# A new push cancels the older run of the same PR, or the older run of main, so stale runs don't hold the runners
# (2026-11-23: seven old runs of main, about 110 jobs, were queued in front of every PR). The nightly run has its own group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Job time limits: the shared runners are often queued and slow (apt downloads alone took 5-10 minutes on busy days), so
# the short limits (15/20/30 minutes) were cancelling healthy jobs (PR #969: 'Anti-cheat tests with libsodium' hit 15 minutes).
jobs:
  # Split in three shards that run side by side (2026-11-24: the one job took about 125 minutes, 114 of them compiling the ~1000
  # test programs). -DOKAY_TEST_SHARD=K/3 (cmake/OkayTestShard.cmake) gives each shard a third of the tests and builds only the
  # test programs they run; every test is in exactly one shard (tests/scripts/check_test_shards.py checks it after Configure).
  # The job "Build & test (Ubuntu)" below waits for all three and is the one the release gate and the docs name.
  build-and-test:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Build & test (Ubuntu ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The compiler cache makes a warm run recompile only what changed. The player and
    # editor builds are their own jobs below so they run in parallel with this one.
    # This job builds and runs the unit tests (about 800). The sandbox and example programs are built by the
    # "player" job and the launcher by the "editor" job, so nothing is left unbuilt (docs/process/automated_testing.md "CI speed").
    # 150, not 90: on a busy runner with a cold or partial compiler cache this job takes 90 minutes or more (PR #1000
    # finished in 89m42s, and #960 and #969 were cancelled by the old 90 minute limit while still running tests).
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # No CCACHE_BASEDIR: it makes ccache hand the compiler relative source paths, so __FILE__ is relative
      # and tests that find files next to their source (test_project_state) fail.
      CCACHE_COMPRESS: "1"
      # Per shard: the engine plus a third of the test programs (the unsharded job used 2G). 3 x 1G, so the total of all
      # job caches grows by about 1G (docs/process/automated_testing.md "CI speed"); ccache -s at the end shows real use.
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v6

      # The runner disk filled up while linking the ~800 tests ("final link failed: No space left on device", 2026-11-20).
      # Remove big preinstalled SDKs this job never uses (about 25 GB) before building.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-ubuntu-ci-s${{ matrix.shard }}-${{ github.sha }}
          # The shard's own cache first, then any Ubuntu test cache (the unsharded job's, before the first sharded save).
          restore-keys: |
            ccache-ubuntu-ci-s${{ matrix.shard }}-
            ccache-ubuntu-ci-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_TEST_SHARD=${{ matrix.shard }}/3 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # This shard's tests are exactly its share of okay_test_shard.json, and every program they run is made by the build.
      - name: Check the test shard
        run: python3 -I tests/scripts/check_test_shards.py build

      - name: Build
        run: cmake --build build -j "$(bash scripts/ci_jobs.sh 4)"   # capped by memory: a bare -j starved the runner (#1140)

      # Four tests at a time. Each test uses its own temp folder or port 0 (checked in the CI-speed audit), and the few
      # that time a real operation are marked RUN_SERIAL in tests/CMakeLists.txt so they still run alone.
      # --timeout 300: a hung test fails in 5 minutes with its output instead of holding the job (tests with their own TIMEOUT keep it).
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4 --timeout 300

      # How warm the compiler cache was: look for the hit rate here (docs/process/automated_testing.md "CI speed").
      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-ubuntu-ci-s${{ matrix.shard }}-${{ github.sha }}

  # The gate: green only when all three shards are. It keeps the name the release gate (scripts/fast_release.py
  # RELEASE_GATE_JOBS), the docs and the merge rules use.
  build-and-test-gate:
    if: always() && github.event_name != 'pull_request' && !inputs.pr_check_only
    name: Build & test (Ubuntu)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All test shards passed
        env:
          SHARDS: ${{ needs.build-and-test.result }}
        run: |
          echo "shards: $SHARDS"
          test "$SHARDS" = "success"

  # The player and editor builds used to run after the tests in the one job above,
  # which added their build times together (about 75 minutes). They are separate
  # jobs now, so the three builds run side by side and a run takes as long as the
  # slowest one. Each keeps its own compiler cache.
  player:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Build player runtime (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-ubuntu-player-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-player-

      # Compile the standalone player (engine + SDL2, no ImGui) so player
      # regressions are caught — the default build leaves it off. The sandbox game and the
      # example programs (netdemo, physicsdemo) are built here too: they only need the engine,
      # and the "Build & test (Ubuntu)" job no longer builds them, so they are still compiled
      # on every run, in parallel with it.
      - name: Build player runtime
        run: |
          cmake -S . -B build-player -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_PLAYER=ON -DOKAY_BUILD_TESTS=OFF \
            -DOKAY_BUILD_SANDBOX=ON -DOKAY_BUILD_LAUNCHER=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-player -j "$(bash scripts/ci_jobs.sh 4)"

      - name: Upload player runtime
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-ci-player
          path: build-player/bin/okay-player
          retention-days: 1

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-ubuntu-player-${{ github.sha }}

  editor:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Build & self-test editor (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-ubuntu-editor-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-editor-

      # Build the editor (Dear ImGui + SDL2) and run its headless self-test so
      # editor regressions are caught. --selftest returns before any SDL/display
      # use, so it runs on the CI box with no GPU.
      - name: Build & self-test editor
        run: |
          cmake -S . -B build-editor -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_EDITOR=ON -DOKAY_BUILD_TESTS=OFF \
            -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-editor -j "$(bash scripts/ci_jobs.sh 4)"
          ./build-editor/bin/OkayEngine --selftest

      - name: Upload editor
        uses: actions/upload-artifact@v6
        with:
          name: ubuntu-ci-editor
          path: build-editor/bin/OkayEngine
          retention-days: 1

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-ubuntu-editor-${{ github.sha }}

  # Export a small game with the editor's real Build and run it headless: its
  # visual scripts must print exactly tests/export/expected.txt. The Windows
  # jobs below run the same check on Windows. Runs once the player and editor
  # builds above have finished.
  export-check:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Export a game and check its visual scripts (Ubuntu)
    needs: [player, editor]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: ubuntu-ci-player
          path: bin
      - uses: actions/download-artifact@v6
        with:
          name: ubuntu-ci-editor
          path: bin

      - name: Export a game and check its visual scripts
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
          chmod +x bin/okay-player bin/OkayEngine
          tests/export/verify.sh bin/OkayEngine

      # The build pipeline's output layout: <Name>.exe + <Name>_Data/, only the assets the scene uses,
      # StreamingAssets, build.json; an old flat build still runs; compact, zip and dry-run output.
      - name: Check the build output layout
        run: tests/export/verify_layout.sh bin/OkayEngine

  # Build the scripting, visual-scripting and robustness tests with
  # AddressSanitizer and UndefinedBehaviorSanitizer and run them: any memory
  # error, leak or undefined behaviour fails the job. Several robustness tests
  # only catch their bug under a sanitizer. Only the listed test targets are built, to
  # keep it fast; this is deliberately not the whole ctest suite.
  sanitizers:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Scripting and robustness tests (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 75   # was 45: a cold-cache run on a pull request needs 41-45 min and was cancelled at the limit (PR #1088)
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      # Per shard: the engine plus a third of the test programs (the unsharded job used 2G). 3 x 1G, so the total of all
      # job caches grows by about 1G (docs/process/automated_testing.md "CI speed"); ccache -s at the end shows real use.
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v6

      # The runner disk filled up while linking the ~800 tests ("final link failed: No space left on device", 2026-11-20).
      # Remove big preinstalled SDKs this job never uses (about 25 GB) before building.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      # Same rule as the other jobs (#953): every run restores, only a push to main saves. This job was the critical path
      # (about 21.6 min, of which a 16.3 min build with no cache). Linking is not cached, so the link share stays.
      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-ubuntu-asan-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-asan-

      # The runner kernel's high mmap randomness can break ASan's shadow memory
      # setup (random "DEADLYSIGNAL" crashes before main); 28 bits is safe.
      - name: Make ASan's address layout reliable
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # -g1: line tables are enough for file:line in sanitizer stack traces and
      # keep the Debug objects a fraction of the size of full -g. -gz and the linker flag compress that debug
      # data: without them this job ran out of disk even after "Free disk space" (2026-11-20, #1067).
      - name: Configure
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS_DEBUG=-g1 -gz" \
            "-DCMAKE_EXE_LINKER_FLAGS=-Wl,--compress-debug-sections=zlib" \
            -DOKAY_SANITIZE=address,undefined,float-cast-overflow -DOKAY_BUILD_TESTS=ON \
            -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_USE_SODIUM=OFF -DOKAY_BUILD_XBOX_UWP=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Every test_script_* target is picked up from tests/CMakeLists.txt, so new
      # script tests join this job without editing it.
      - name: List the tests
        run: |
          TESTS="test_visualscript test_vs_nodes test_vs_types test_okayscript_next test_scripting"
          TESTS="$TESTS $(grep -oE 'add_executable\(test_script_[A-Za-z0-9_]+' tests/CMakeLists.txt | cut -c16- | tr '\n' ' ')"
          if grep -q 'add_executable(test_vs_editor_model' tests/CMakeLists.txt; then TESTS="$TESTS test_vs_editor_model"; fi
          # Robustness tests whose bugs only show up under a sanitizer.
          TESTS="$TESTS test_anim_sm_realloc test_prefs_misc test_loaders_robust test_scene_records"
          TESTS="$TESTS test_physics_callback_removal test_physics_nan test_parent_cycles test_scheduler_reentry"
          # Model-file readers fed hostile input: memory errors in the FBX / OBJ / STL / PLY /
          # glTF / Collada parsers only show under a sanitizer.
          for t in test_fbx_hostile test_model_readers test_model_readers_fuzz test_collada_reader test_glb_container; do
            if grep -q "add_executable($t " tests/CMakeLists.txt; then TESTS="$TESTS $t"; fi
          done
          for t in test_net_hardening test_net_races; do
            if grep -q "add_executable($t " tests/CMakeLists.txt; then TESTS="$TESTS $t"; fi
          done
          # OkayUI's own robustness tests: NaN / infinity / 1e30 positions must not reach a float-to-int cast
          # (float-cast-overflow is on in this job). Run from the repo root (see the Test step).
          OKAYUI_TESTS="test_okayui_fuzz test_okayui_codeedit_fuzz test_okayui_dock_fuzz test_okayui_windows_fuzz"
          TESTS="$TESTS $OKAYUI_TESTS"
          echo "OKAYUI_TESTS=$OKAYUI_TESTS" >> "$GITHUB_ENV"
          # The experimental Xbox UWP backend (OKAY_BUILD_XBOX_UWP=ON above; no other job turns it on). Only tests that do not link
          # the engine (each about 10 to 25 s to build): touch and text composition, the runtime pieces (lifecycle with the back
          # button, title-safe area, pads, paths, audio, backend over a fake host, HTTP) and pad hot-plug slots. Before 2026-11-22
          # only the touch test ran anywhere in CI.
          XBOX_TESTS="test_xbox_uwp_touch test_xbox_uwp_runtime test_xbox_uwp_padhub"
          TESTS="$TESTS $XBOX_TESTS"
          echo "XBOX_TESTS=$XBOX_TESTS" >> "$GITHUB_ENV"
          echo "SAN_TESTS=$TESTS" >> "$GITHUB_ENV"
          echo "$TESTS"

      # Capped at 3 parallel jobs: with an unbounded -j the runner was shut down mid-link
      # (out of memory) on most runs, because every sanitized test executable links the
      # whole sanitized engine.
      - name: Build
        run: |
          ccache -z || true
          cmake --build build-asan -j 3 --target $SAN_TESTS

      # Look for the hit rate here: it is the before/after measure for the cache.
      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-ubuntu-asan-${{ github.sha }}

      - name: Test
        working-directory: build-asan/tests
        run: |
          failed=""
          for t in $SAN_TESTS; do
            case " $OKAYUI_TESTS $XBOX_TESTS " in *" $t "*) continue;; esac
            echo "== $t"
            "./$t" || failed="$failed $t"
          done
          # The OkayUI tests live in build-asan/okayui and read golden files by path: run them headless.
          for t in $OKAYUI_TESTS; do
            echo "== $t"
            (cd "$GITHUB_WORKSPACE" && SDL_VIDEODRIVER=dummy "build-asan/okayui/$t") || failed="$failed $t"
          done
          # The Xbox UWP tests live in build-asan/platform/xbox_uwp.
          for t in $XBOX_TESTS; do
            echo "== $t"
            "$GITHUB_WORKSPACE/build-asan/platform/xbox_uwp/$t" || failed="$failed $t"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  # The model readers on real files (docs/content/model_corpus.md). Assimp itself was removed from the engine on 2026-11-24;
  # its source tree is still fetched here, as DATA only: its test folder holds the real model files the corpus manifest
  # (tests/data/model_corpus_manifest.tsv) was recorded from. Nothing from it is compiled. Only the model test targets are built.
  model-corpus:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Model readers on the real-file corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1G
      CORPUS_TAG: v5.4.3   # the Assimp release whose test folder the corpus manifest was recorded from
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache

      - name: Restore the corpus files
        id: corpus-src
        uses: actions/cache@v5
        with:
          path: ~/assimp-src
          key: assimp-src-${{ env.CORPUS_TAG }}

      - name: Fetch the corpus files
        if: steps.corpus-src.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$CORPUS_TAG" https://github.com/assimp/assimp.git "$HOME/assimp-src"

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-corpus-${{ github.sha }}
          restore-keys: ccache-corpus-

      - name: Configure
        run: |
          cmake -S . -B build-corpus -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF \
            -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_USE_SODIUM=OFF

      - name: Build
        run: |
          cmake --build build-corpus -j "$(bash scripts/ci_jobs.sh 4)" --target test_model_readers test_model_readers_fuzz test_collada_reader \
            test_model_import_rig test_gltf_import test_fbx_reader test_glb_container test_model_corpus test_own_dispatch_e2

      - name: Test
        run: ctest --test-dir build-corpus --output-on-failure -R '^(model_readers|model_readers_fuzz|collada_reader|model_import_rig|gltf_import|fbx_reader|glb_container)$'

      # Every row of tests/data/model_corpus_manifest.tsv re-read from the corpus folder above, so a reader change that alters a
      # real file's counts fails here; own_dispatch_e2 also reads the three real RAW files.
      - name: Test the real-file corpus
        run: OKAY_MODEL_CORPUS="$HOME/assimp-src/test" ctest --test-dir build-corpus --output-on-failure -R '^(model_corpus|own_dispatch_e2)$'

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-corpus-${{ github.sha }}

  # Our own HTTP client (docs/platform/own_http.md) with the CMake option on. NOT required for merging and the
  # option stays OFF by default everywhere else. Only the two header-only test targets are built (the client
  # does not link the engine). OKAY_REQUIRE_TLS_TESTS=1 makes a skipped TLS case (no libssl, no openssl program)
  # a failure, so the certificate checks cannot silently go missing. The sanitizer script then runs both tests
  # under ASan and UBSan.
  own-http:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Own HTTP client (OKAY_OWN_HTTP=ON, TLS tests required)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev openssl libssl-dev

      - name: Configure
        run: |
          cmake -S . -B build-http -G Ninja -DCMAKE_BUILD_TYPE=Release -DOKAY_OWN_HTTP=ON \
            -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_USE_SODIUM=OFF
          # the option must reach the engine as a compile definition
          grep -q 'OKAY_OWN_HTTP=1' build-http/build.ninja

      - name: Build
        run: cmake --build build-http -j2 --target test_own_http test_own_http_inflate test_own_http_net test_own_http_download test_launcher_download_own test_native_fetch test_playfab_own

      - name: Test (a skipped TLS case fails)
        env:
          OKAY_REQUIRE_TLS_TESTS: "1"
          OKAY_REQUIRE_DIFFERENTIAL: "1"
        run: ctest --test-dir build-http --output-on-failure -R '^(own_http|own_http_inflate|own_http_net|own_http_download|launcher_download_own|native_fetch|playfab_own)$'

      - name: Sanitizers (ASan + UBSan)
        env:
          OKAY_REQUIRE_TLS_TESTS: "1"
          OKAY_REQUIRE_DIFFERENTIAL: "1"
        run: scripts/own_http_sanitized.sh 100000

  # The whole own stack at once (docs/status/own_stack_rollout.md): a build with -DOKAY_OWN_STACK=ON, so our own model readers,
  # HTTP client, okay::platform backend and OkayUI are the defaults, and no libsodium. -DOKAY_OWN_STACK_CRYPTO_TEST=ON also
  # lets our own (unreviewed) crypto run in THESE tests; it is for test builds only and releases refuse it
  # (scripts/check_release_own_stack.sh). Not a required check: it tells us how ready the own stack is, it does not gate
  # merges. Only the test targets of the own pieces are built, and the compiler cache is reused.
  own-stack:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Own stack (OKAY_OWN_STACK=ON, no libsodium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache openssl libssl-dev xvfb

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-ubuntu-ownstack-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-ownstack-
            ccache-ubuntu-ci-

      - name: Configure
        run: |
          cmake -S . -B build-own -G Ninja -DCMAKE_BUILD_TYPE=Release -DOKAY_OWN_STACK=ON -DOKAY_OWN_STACK_CRYPTO_TEST=ON \
            -DOKAY_USE_SODIUM=OFF -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache | tee configure.log
          grep -q "OKAY_OWN_STACK=ON" configure.log
          # the switches must really reach the compiler, or this job would test the old stack
          grep -q 'OKAY_OWN_STACK_BUILD' build-own/build.ninja
          grep -q 'OKAY_PLATFORM_DEFAULT_OWN' build-own/build.ninja
          grep -q 'OKAY_OWN_CRYPTO' build-own/build.ninja

      # Only the own pieces' tests: model readers, own_http*, platform*, okayui*, anticheat_*, net_crypto_own and the
      # own-stack switch itself. The target names come from the configured build (some are made in loops, so they are not
      # all in tests/CMakeLists.txt as literal text), so new tests of these kinds join the job. The same names give the ctest filter.
      - name: Build the own-stack tests
        run: |
          ninja -C build-own -t targets all | grep -oE '^test_[a-z0-9_]+' | sort -u \
            | grep -E '^test_([a-z0-9_]*(reader|hostile|fbx|3ds|bvh|collada|glb|gltf|obj_import)[a-z0-9_]*|model_(readers|readers_fuzz|corpus|import_rig)|own_[a-z0-9_]+|platform[a-z0-9_]*|net_crypto_own|net_crypto|anticheat_[a-z0-9_]+|net_anticheat[a-z0-9_]*|ui_backend|okayui[a-z0-9_]*)$' > own-stack-targets.txt
          wc -l own-stack-targets.txt
          cmake --build build-own -j 2 --target $(cat own-stack-targets.txt | tr '\n' ' ')
          echo "OWN_STACK_TESTS=^($(sed 's/^test_//' own-stack-targets.txt | tr '\n' '|' | sed 's/|$//')|release_refuses_own_crypto)" >> "$GITHUB_ENV"

      - name: Show the stack line (the job must be testing our own stack)
        run: |
          ./build-own/tests/test_own_stack | tee stack.txt
          grep -q 'platform=own' stack.txt
          grep -q 'http=own' stack.txt
          grep -q 'readers=own(fbx,dae,3ds,bvh' stack.txt
          grep -q 'crypto=own(test)' stack.txt

      - name: Test
        # net_crypto_sodium is the libsodium side-by-side test: this job has no libsodium on purpose
        run: ctest --test-dir build-own --output-on-failure -j 2 -R "$OWN_STACK_TESTS" -E 'net_crypto_sodium|anticheat_sql' 

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-ubuntu-ownstack-${{ github.sha }}

  # The no-libsodium path of the anti-cheat and launcher crypto: shared/AntiCheatCrypto.hpp is a thin wrapper over okay::crypto
  # (our own Ed25519 and SHA-512; the TweetNaCl-derived port is deleted). These targets do not link the engine, so this is quick.
  # okay::crypto has not had its outside review yet (CLAUDE.md rule 18); libsodium stays the preferred path where it is built.
  anticheat-crypto-nosodium:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Anti-cheat crypto without libsodium (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev

      - name: Configure
        run: |
          cmake -S . -B build-nosodium -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_USE_SODIUM=OFF

      - name: Build
        run: cmake --build build-nosodium -j2 --target test_crypto test_anticheat_golden test_anticheat_integrity_ownlib test_anticheat_integrity_fallback test_update_signature test_launcher_versions test_self_update

      - name: Test
        run: ctest --test-dir build-nosodium --output-on-failure -R '^(crypto|anticheat_golden|anticheat_integrity_ownlib|anticheat_integrity_fallback|update_signature|launcher_versions|self_update)$'

  # Cross-compile the Windows editor + player (the release build) and the
  # visual-scripting and mesh file tests, for the windows-export job to run on real Windows.
  windows-cross:
    name: Cross-compile Windows build (MinGW)
    runs-on: ubuntu-latest
    timeout-minutes: 120  # build jobs are now capped by memory (2 on a 16 GB runner, build-windows-dist.sh), so cold builds take longer; a cold compiler cache (main's CI not finished, so no fresh cache) took over 60 min twice on 2026-11-22 (#1104, #1106); warm runs take 22-34 min
    env:
      SDL2_VERSION: 2.30.9
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
      # No CCACHE_SLOPPINESS: the editor's __DATE__ " " __TIME__ lives in editor/BuildStamp.cpp (recompiled every run, under a
      # second), so ccache can reuse editor/main.cpp (about 5 minutes) and every build stamp stays exact.
    steps:
      - uses: actions/checkout@v6

      # The toolchain (.deb files) lives in the Actions cache, keyed on the Ubuntu release, not on the runner image version:
      # two image versions were in use at once on 2026-11-24 and the one with no cache hit downloaded 161 MB at about
      # 150 KB/s until the 25-minute limit failed the job. scripts/ci-install-mingw.sh installs from the cache with no
      # network when it can, else downloads only what is missing (several files at once, retried), and checks that the
      # compiler is the win32 thread model (rule 21a). The cache is saved only when its set of files changed.
      - name: Note the Ubuntu release
        run: echo "UBUNTU_CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")" >> "$GITHUB_ENV"

      - name: Restore downloaded apt packages
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-win32-${{ env.UBUNTU_CODENAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-mingw-win32-${{ env.UBUNTU_CODENAME }}-
            apt-mingw-

      - name: Install toolchain
        id: install
        timeout-minutes: 20
        run: |
          bash scripts/ci-apt-cache.sh before
          bash scripts/ci-install-mingw.sh

      - name: Check for newly downloaded apt packages
        id: apt-new
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        run: bash scripts/ci-apt-cache.sh after "$INSTALL_OUTCOME"

      - name: Save downloaded apt packages
        if: always() && steps.apt-new.outputs.save == '1'
        uses: actions/cache/save@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-win32-${{ env.UBUNTU_CODENAME }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fetch SDL2 and libsodium (MinGW)
        run: |
          bash scripts/fetch-tarball.sh sdl2-mingw.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz" \
            "https://www.libsdl.org/release/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          mkdir -p sdl2-mingw && tar xzf sdl2-mingw.tar.gz -C sdl2-mingw --strip-components=1
          echo "SDL2_MINGW_PREFIX=$PWD/sdl2-mingw/x86_64-w64-mingw32" >> "$GITHUB_ENV"
          echo "OKAY_SODIUM_MINGW_PREFIX=$(bash scripts/fetch-libsodium-mingw.sh "$PWD")" >> "$GITHUB_ENV"   # pinned SHA-256

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-mingw-ci-${{ github.sha }}
          restore-keys: |
            ccache-mingw-ci-
            ccache-mingw-

      - name: Build the Windows distribution
        run: |
          ccache -z >/dev/null
          scripts/build-windows-dist.sh

      - name: Build the visual-scripting and mesh file tests for Windows
        run: |
          cmake -S . -B build-win-tests -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF \
            -DOKAY_BUILD_PLAYER=OFF -DOKAY_BUILD_EDITOR=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$SDL2_MINGW_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH="/usr/x86_64-w64-mingw32;$SDL2_MINGW_PREFIX" \
            -DOKAY_SODIUM_PREFIX="$OKAY_SODIUM_MINGW_PREFIX"
          cmake --build build-win-tests -j --target test_vs_acceptance test_vs_debug test_game_fiber \
            test_polymesh test_mesh_asset test_poly_ops test_okayui_render_sdlhost
          mkdir -p win-tests
          cp build-win-tests/tests/test_vs_acceptance.exe build-win-tests/tests/test_vs_debug.exe \
             build-win-tests/tests/test_game_fiber.exe build-win-tests/tests/test_polymesh.exe \
             build-win-tests/tests/test_mesh_asset.exe build-win-tests/tests/test_poly_ops.exe \
             build-win-tests/okayui/test_okayui_render_sdlhost.exe \
             "$SDL2_MINGW_PREFIX/bin/SDL2.dll" win-tests/

      # How well the compiler cache worked and which files took longest (read these to find what slows the job).
      - name: Compiler cache and build time report
        if: always()
        run: |
          ccache -s || true
          for d in build-win build-win-tests; do
            [ -f "$d/.ninja_log" ] || continue
            echo "== $d: slowest 15 steps (seconds)"
            awk -F'\t' '!/^#/ {t=($2-$1)/1000; if (!($4 in seen)) {seen[$4]=1; printf "%7.1f %s\n", t, $4}}' "$d/.ninja_log" | sort -rn | head -15
          done

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: windows-ci-build
          path: |
            build-win-dist/Tools/
            win-tests/
          retention-days: 3

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-mingw-ci-${{ github.sha }}

  # On a real Windows machine: run the visual-scripting tests (including the
  # Windows fiber the editor's debugger uses) and the mesh file tests, then
  # export a game with the Windows editor and check what its visual scripts print.
  windows-export:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Windows export check
    needs: windows-cross
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          name: windows-ci-build
          path: winbuild

      - name: Run the visual-scripting and mesh file tests
        shell: pwsh
        run: |
          $failed = @()
          # test_okayui_render_sdlhost: OkayUI's own Direct3D 11 renderer inside SDL's direct3d11 renderer (OKAY_UI_OWN_RENDER), on the
          # runner's Direct3D 11 device (no GPU: Windows' software adapter); it says SKIPPED for a renderer SDL cannot make here.
          foreach ($t in "test_vs_acceptance", "test_vs_debug", "test_game_fiber", "test_polymesh", "test_mesh_asset", "test_poly_ops", "test_okayui_render_sdlhost") {
            Write-Host "== $t"
            & "winbuild/win-tests/$t.exe"
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }

      - name: Export a game and check its visual scripts
        shell: pwsh
        run: ./tests/export/verify.ps1 -Editor winbuild/build-win-dist/Tools/OkayEngine.exe -Work "$env:RUNNER_TEMP/export"

  # Real Windows process restart: the test holds a named mutex and a file lock
  # (the same kind of single-instance lock the launcher uses), exits, and the
  # helper must start the new process once. The install path is
  # "Program Files (x86)" and the new process must still see --launcher plus
  # an argument that itself contains spaces and parentheses. The same job runs
  # the verified restart (a new file that is the wrong version or cannot start is
  # rolled back and the previous program is started) and the self-update rules.
  windows-restart:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Windows updater restart
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF
          -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_BUILD_EDITOR=OFF
          -DOKAY_BUILD_PLAYER=OFF -DOKAY_USE_SODIUM=OFF

      - name: Build the restart test
        # test_self_update links okay::crypto (the signed versions.json check); the two anti-cheat crypto tests are added here so
        # our own Ed25519 and SHA-512 (the no-libsodium path) also run on real Windows with MSVC.
        run: cmake --build build --config Release --target test_app_restart test_self_update test_anticheat_golden test_anticheat_integrity_fallback --parallel

      - name: Run the restart and self-update tests
        # app_restart also drives the verified restart with real processes: self-check, rollback to the previous launcher file, state file.
        # --timeout: a hang in a real-process case fails in 150 s with its output instead of using the whole 30 minutes; -V prints each case as it runs.
        run: ctest --test-dir build -C Release -R "^(app_restart|self_update|anticheat_golden|anticheat_integrity_fallback)$" --output-on-failure --timeout 150 -V

  # MSVC build-and-test (rule 24d, step 1). NOT required. Builds the core engine library and pure-logic tests with
  # the real MSVC compiler (the release stays the MinGW cross-compile). Nothing from the SDK is shipped.
  msvc-build:
    name: MSVC build and test (not required)
    # Not on pull requests yet: CLAUDE.md rule 6 needs every PR job green, and this job is new. It runs on pushes to
    # main so its results are visible without blocking merges; the owner decides later whether it becomes required.
    if: github.event_name != 'pull_request' && !inputs.pr_check_only
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Configure (MSVC, Ninja, Release)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cmake -S . -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF -DOKAY_BUILD_EDITOR=OFF -DOKAY_BUILD_PLAYER=OFF -DOKAY_USE_SODIUM=OFF -DOKAY_BUILD_OKAYUI_TESTS=OFF"
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }

      - name: Build the engine and pure-logic tests
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" && cmake --build build-msvc --target test_math test_scene test_serialize test_material test_actionlist test_prefs test_physics3d test_core_features test_charctrl test_transform_input"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Run the tests
        shell: pwsh
        run: ctest --test-dir build-msvc -R "^(math|scene|serialize|material|actionlist|prefs|physics3d|core_features|charctrl|transform_input)$" --output-on-failure --timeout 150

  web-build:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: WebGL build (Emscripten)
    runs-on: ubuntu-latest
    # The build takes 12 to 20 minutes with a warm cache. A run that is still going after 40 minutes is a stalled runner,
    # not a slow build: fail it so a re-run starts on a fresh machine instead of occupying a slot for hours.
    timeout-minutes: 40
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1G
      OKAY_WEB_CCACHE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install ccache
        run: sudo apt-get install -y --no-install-recommends ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: |
            ccache-web-

      # Pull in Emscripten. This runner has network, so Emscripten's SDL2 port is
      # fetched + cached here (the one online step the web build needs).
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v15
        with:
          version: 3.1.51
          actions-cache-folder: emsdk-cache

      # Compile the player to WebAssembly/WebGL via the same script the editor's
      # "Build ▸ Web" export writes, so a broken web build fails CI (it silently
      # rotted before — the engine didn't even compile under Emscripten's Clang).
      - name: Build WebGL player
        run: bash scripts/build-web.sh

      - name: Verify wasm output
        run: |
          test -f build-web/web/okay-player.html
          test -f build-web/web/okay-player.js
          test -f build-web/web/okay-player.wasm
          ls -la build-web/web/

      # Pack the test game beside the player (scripts/web_package.py) and play it in headless Chromium: the first frame
      # is drawn, a key press and a right-click reach the game script, a save and prefs survive a reload (IndexedDB),
      # a Gamepad API pad reaches the game, Space and arrows do not scroll an embedding page (tests/scripts/test_web_player.js).
      - name: Package the web test game
        run: python3 -I scripts/web_package.py --build build-web/web --game tests/web/webtest_game --out build-web/site --zip build-web/webtest-web.zip

      - name: Install Playwright and Chromium (test tools only; nothing of them ships)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.63.0
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium

      - name: Play the web test game in headless Chromium
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/scripts/test_web_player.js build-web/site --json build-web/web_player_test.json

      # okay.js (web/okayjs/, our own browser library with the engine's script API): its examples in the same Chromium
      # (the lit cube's pixels, a key reaching the script, resize, pixel ratio 2, WebGL 1 asked for and as the fallback).
      - name: okay.js in headless Chromium
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/okayjs/test_okayjs_browser.js

      - name: Upload WebGL build
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: okayspace-webgl
          path: |
            build-web/web/
            build-web/site/
            build-web/web_player_test.json

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}

  # ---- Anti-cheat and updater checks that the jobs above can't run -----------------------------
  # Three jobs of their own, none of them a required check, each under 15 minutes.

  # The SQL tests (anticheat, reports, blocks, chat receipts, member moderation) need a Postgres.
  # The test scripts skip themselves (exit 77) without OKAY_SQL_TEST_PGHOST, so no other job ran
  # them and the row-level-security rules were never checked in CI. Here a throwaway Postgres
  # service container is the target; each script makes and drops its own database and loads
  # docs/sql/*.sql into it twice (the files must be idempotent). A skip is a failure here.
  sql-tests:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: SQL row-level-security tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OKAY_SQL_TEST_PGHOST: localhost
      OKAY_SQL_TEST_PGPORT: "5432"
      OKAY_SQL_TEST_PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6

      - name: Install the Postgres client
        run: |
          command -v psql >/dev/null || { bash scripts/ci-apt-mirror.sh; sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version

      - name: Run the SQL tests
        run: |
          failed=""
          for t in tests/scripts/test_*_sql.sh; do
            echo "== $t"
            bash "$t"; code=$?
            if [ "$code" -ne 0 ]; then echo "$t exited $code (a skip, 77, counts as a failure here)"; failed="$failed $t"; fi
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  # The ticket service's signing code (supabase/functions/session-ticket/ticket.ts) against Web Crypto's Ed25519 on
  # a current Node, the signed-update tool (scripts/sign_index.py) with its guards, and the reference account server's
  # limits. They were run by hand before.
  ticket-and-script-tests:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Ticket function, update signing and account server tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ticket function self-test (Node)
        working-directory: supabase/functions/session-ticket
        run: |
          node --version
          node --experimental-strip-types ticket_test.ts

      - name: Update signing tool and the publish script's guards
        run: bash tests/scripts/test_sign_index.sh

      - name: Release signing wrapper (sign-release.sh)
        run: bash tests/scripts/test_sign_release.sh

      - name: Publish script checks
        run: bash tests/scripts/test_publish_supabase_checks.sh

      - name: Reference account server limits
        run: python3 -I tests/scripts/test_account_server.py

      - name: Crash report to GitHub issue script (formatting, dedupe, hostile text; no network)
        run: python3 -I tests/scripts/test_crash_to_issue.py

      - name: Crash report to GitHub issue script over HTTP (fake Supabase and GitHub servers on 127.0.0.1)
        run: python3 -I tests/scripts/test_crash_to_issue_http.py

      - name: Account server and key are not stored in the repository (configure-time only)
        run: python3 -I tests/scripts/test_account_config.py

      - name: Crash reports workflow keeps its safety properties (opt-in schedule, dry run by default, minimal permissions)
        run: python3 -I tests/scripts/test_crash_workflow.py

      - name: The programs never need GitHub (no GitHub address or word in shipped code and files; releases bake in the update server)
        run: python3 -I tests/scripts/test_no_github_runtime.py

      - name: The pure-move checker for the editor/main.cpp split (edited, reordered, lost and extra lines fail)
        run: python3 -I tests/scripts/test_check_pure_move.py

      - name: Duplicate-code guard (scripts/dup_lint.py) on throw-away repositories
        run: python3 -I scripts/tests/test_dup_lint.py

      - name: Generated docs rebuilt on main (precheck --restore-generated, regen-docs.yml commit-back) on throw-away repositories
        run: python3 -I scripts/tests/test_precheck_generated.py

  # The anti-cheat tests that only do their real work with libsodium. The main Ubuntu job installs
  # no libsodium-dev, so a test that says "built without libsodium" there only runs its refusal
  # branch and never signs, seals or verifies anything (docs/feature_map/39). This job installs it,
  # checks that the configure step really enabled it, builds only those tests and fails if any of
  # them still prints that branch. The launcher-side ticket flow runs here end to end against a local
  # fake ticket service (curl is on the runner).
  anticheat-crypto:
    if: github.event_name != 'pull_request' && !inputs.pr_check_only   # full suite: nightly and on main; PRs are checked before the push (CLAUDE.md rule 6)
    name: Anti-cheat tests with libsodium (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          bash scripts/ci-apt-mirror.sh
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libsdl2-dev ccache libsodium-dev pkg-config curl

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: ccache-ubuntu-anticheat-${{ github.sha }}
          restore-keys: |
            ccache-ubuntu-anticheat-
            ccache-ubuntu-ci-

      - name: Configure (libsodium must be on)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF \
            -DOKAY_BUILD_OKAYUI_TESTS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache | tee configure.log
          grep -q "packet encryption ENABLED (libsodium)" configure.log || { echo "::error::libsodium was not enabled: the crypto tests would not run"; exit 1; }

      - name: Build the tests
        run: |
          TESTS=$(grep -ohE 'add_executable\((test_(net_anticheat[a-z0-9_]*|anticheat_[a-z_]+|ticket_client|update_signature|account|self_update|launcher_versions))' tests/CMakeLists.txt | cut -c16- | sort -u | tr '\n' ' ')
          echo "$TESTS"
          cmake --build build -j 4 --target $TESTS

      - name: Test
        run: |
          ctest --test-dir build -R 'anticheat|ticket_client|update_signature|^account$|self_update|launcher_versions' --output-on-failure -V 2>&1 | tee ctest.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -E "built without libsodium|only the refusal is checked|part B is skipped" ctest.log; then
            echo "::error::a crypto test took its no-libsodium branch"; exit 1
          fi

      # Saved only by pushes to main: PR runs restore main's cache and never write one, so the ten per-job
      # caches stay under GitHub's 10 GB repository limit and are not evicted (docs/process/automated_testing.md "CI speed").
      - name: Save compiler cache (main only)
        if: ${{ always() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: ccache-ubuntu-anticheat-${{ github.sha }}
