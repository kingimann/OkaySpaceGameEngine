name: Release Windows build

# Cross-compiles the Windows distribution (launcher, editor, player + SDL2.dll)
# from Linux with MinGW-w64 and publishes it as a GitHub Release. Triggers on a
# version tag, or on demand via "Run workflow" — the manual run tags + releases
# the version in dist/VERSION.txt.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # needed to attach assets to a Release

jobs:
  windows-exe:
    name: Cross-compile Windows exes (MinGW)
    runs-on: ubuntu-latest
    # A normal release takes ~11 min; never let a stuck download hold one for hours.
    timeout-minutes: 45
    outputs:
      ver: ${{ steps.pkg.outputs.ver }}
    env:
      SDL2_VERSION: 2.30.9
      # Compiler cache kept between release builds (actions/cache below): only
      # changed files recompile, so a typical release builds in a few minutes.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
      # "true" when the repo has the secret that the Supabase publish step needs.
      SUPABASE_PUBLISH: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      # The runner's Ubuntu mirror is sometimes slow enough that downloading the
      # MinGW compiler outlasts the step timeout. Keep the downloaded packages in
      # the Actions cache (one entry per runner image) so later runs install
      # from it instead of the mirror.
      - name: Note the runner image
        run: echo "RUNNER_IMAGE=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore downloaded apt packages
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-release-${{ env.RUNNER_IMAGE }}

      # Ubuntu mirrors occasionally hang or crawl (one release sat here 45 min):
      # bounded attempts with apt's own timeouts, retried a few times. Only the
      # 64-bit MinGW compiler is installed (the full mingw-w64 package also pulls
      # the 32-bit one, doubling a ~290 MB download), without recommends.
      - name: Install toolchain
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives=$HOME/apt-cache"
          for i in 1 2 3; do
            if timeout 240 sudo apt-get $APT update && \
               timeout 600 sudo apt-get $APT install -y --no-install-recommends cmake ninja-build g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev zip nsis ccache; then
              sudo chown -R "$USER" ~/apt-cache
              exit 0
            fi
            echo "apt attempt $i failed or timed out; retrying"
            sleep 10
          done
          exit 1

      - name: Fetch SDL2 (MinGW dev)
        run: |
          curl -sSL --retry 3 --retry-delay 5 --max-time 300 -o sdl2-mingw.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          mkdir -p sdl2-mingw
          tar xzf sdl2-mingw.tar.gz -C sdl2-mingw --strip-components=1
          echo "SDL2_MINGW_PREFIX=$PWD/sdl2-mingw/x86_64-w64-mingw32" >> "$GITHUB_ENV"

      - name: Fetch libsodium (MinGW prebuilt)
        # Statically linked into the exes for authenticated packet encryption — no
        # extra DLL ships. If this step is removed, the build is simply unencrypted.
        run: |
          curl -sSL --retry 3 --retry-delay 5 --max-time 300 -o libsodium-mingw.tar.gz \
            "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20-stable-mingw.tar.gz"
          mkdir -p libsodium-mingw
          tar xzf libsodium-mingw.tar.gz -C libsodium-mingw
          echo "OKAY_SODIUM_MINGW_PREFIX=$PWD/libsodium-mingw/libsodium-win64" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-mingw-${{ github.sha }}
          restore-keys: ccache-mingw-

      - name: Build Windows distribution
        # The account server + public key are baked into the build as the CMake
        # defaults (see the top-level CMakeLists), pointing at the OkaySpace
        # Supabase project. We intentionally do NOT override them from CI secrets
        # anymore: a stale/empty secret used to silently misconfigure the build
        # and break sign-in. To point a fork at a different server, change the
        # CMake defaults instead.
        run: |
          ccache -z || true
          scripts/build-windows-dist.sh
          ccache -s || true

      - name: Package zip
        id: pkg
        run: |
          VER=$(cat build-win-dist/VERSION.txt 2>/dev/null || echo dev)
          NAME="OkaySpace-windows-v${VER}"
          mkdir -p "$NAME"
          cp -r build-win-dist/* "$NAME"/
          zip -r "${NAME}.zip" "$NAME"
          echo "zip=${NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer (NSIS)
        # One-click setup .exe that installs or updates in place (see the .nsi).
        # This is what the launcher's "download the installer" flow hands users.
        run: |
          # NSIS resolves a relative File path against the .nsi's own directory,
          # not the workspace, so pass an absolute DISTDIR (and OUTFILE).
          makensis -DVERSION="${{ steps.pkg.outputs.ver }}" \
                   -DDISTDIR="$PWD/build-win-dist" \
                   -DOUTFILE="$PWD/OkaySpace-Setup.exe" \
                   scripts/okayspace-installer.nsi
          ls -la OkaySpace-Setup.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.zip }}

      # On a tag push, release that tag. On a manual run, create/refresh a
      # release for the version in dist/VERSION.txt (the runner's GITHUB_TOKEN
      # can push the tag).
      # Upload the zip AND the individual files as release assets. The in-app
      # updater (launcher + editor) downloads the individual files from
      # releases/latest/download/<name>, so they must be present as assets.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Upload the individual files the in-app updater fetches by name from
          # releases/latest/download/<name>. The launcher + its SDL2.dll sit at the
          # dist root; the editor/player live in Tools/. softprops uses each file's
          # basename as the asset name, so these resolve to the URLs the updater uses.
          files: |
            ${{ steps.pkg.outputs.zip }}
            OkaySpace-Setup.exe
            build-win-dist/OkaySpace.exe
            build-win-dist/Tools/OkayEngine.exe
            build-win-dist/Tools/OkaySpacePlayer.exe
            build-win-dist/SDL2.dll
            build-win-dist/VERSION.txt
            build-win-symbols/OkayEngine.debug
            dist/CHANGELOG.txt
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.pkg.outputs.ver) }}
          name: OkaySpace v${{ steps.pkg.outputs.ver }}
          generate_release_notes: true

      # Also publish to the Supabase "releases" bucket (launchers check it first),
      # when the repo has a SUPABASE_SERVICE_KEY secret. Without it this is skipped.
      - name: Publish to Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        if: env.SUPABASE_PUBLISH == 'true'
        run: scripts/publish-supabase.sh

  # The Linux game server: the player runtime built for Linux, which runs games
  # headless with --server. The editor's "Dedicated Server" export downloads it
  # (releases/latest/download/okay-server-linux-x64) to make a Linux server
  # folder from Windows. Built on 22.04 so it runs on most VPS distros (glibc 2.35+).
  linux-server:
    name: Build the Linux game server
    needs: windows-exe
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install toolchain
        timeout-minutes: 20
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for i in 1 2 3; do
            if timeout 240 sudo apt-get $APT update && \
               timeout 600 sudo apt-get $APT install -y --no-install-recommends cmake ninja-build g++ libsdl2-dev libsodium-dev; then
              exit 0
            fi
            echo "apt attempt $i failed or timed out; retrying"
            sleep 10
          done
          exit 1

      - name: Build the server runtime
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DOKAY_BUILD_PLAYER=ON -DOKAY_BUILD_EDITOR=OFF -DOKAY_BUILD_LAUNCHER=OFF \
                -DOKAY_BUILD_TESTS=OFF -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_TOOLS=OFF
          cmake --build build-linux --target okay-player
          cp build-linux/bin/okay-player okay-server-linux-x64
          strip okay-server-linux-x64
          ./okay-server-linux-x64 --help | head -n 3

      - name: Attach to the release
        uses: softprops/action-gh-release@v3
        with:
          files: okay-server-linux-x64
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.windows-exe.outputs.ver) }}
