name: Windows tests

# Builds the whole unit-test suite with the release compiler (MinGW-w64, win32 thread model, cross-compiled on
# Ubuntu exactly like the "Cross-compile Windows build (MinGW)" job in ci.yml) and runs it on a real Windows machine.
# NON-BLOCKING (owner, 2026-11-20): it does not run on pull requests, so it can never hold a PR merge or a release.
# A failing test turns this workflow red (visible on main), but nothing waits on it.
# The owner decides later whether to make it required. No secrets are used.
on:
  push:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC nightly, a quiet hour and not on the hour
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to test (empty = the branch this was started on)"
        required: false
        default: ""

# One run per ref at a time, and a started run is never cancelled: with cancel-in-progress on, every push to main
# cancelled the main run before it (a cold build takes up to three hours), so no run ever finished. Now the next run
# waits; if more pushes land meanwhile, GitHub keeps only the newest of the waiting runs.
concurrency:
  group: windows-tests-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build Windows tests (MinGW cross-compile)
    runs-on: ubuntu-latest
    # 180, not 120: a cold build (no compiler cache) plus the upload of the bundle ran past 120 minutes and was cancelled
    # before any test ran (runs 44910237711 and 44937036735).
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Note the runner image
        run: echo "RUNNER_IMAGE=$ImageVersion" >> "$GITHUB_ENV"

      - name: Restore downloaded apt packages
        uses: actions/cache/restore@v5
        with:
          path: ~/apt-cache
          key: apt-mingw-${{ env.RUNNER_IMAGE }}-wintests-${{ github.run_id }}
          restore-keys: apt-mingw-${{ env.RUNNER_IMAGE }}-

      - name: Install toolchain
        timeout-minutes: 25
        run: |
          mkdir -p ~/apt-cache/partial
          bash scripts/ci-apt-mirror.sh
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Dir::Cache::archives=$HOME/apt-cache"
          for i in 1 2 3; do
            if timeout 240 sudo apt-get $APT update && \
               timeout 600 sudo apt-get $APT install -y --no-install-recommends cmake ninja-build libx11-dev libxrandr-dev libgl-dev libasound2-dev libgl1-mesa-dri g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev ccache; then
              exit 0
            fi
            echo "apt attempt $i failed or timed out; retrying"
            sleep 10
          done
          exit 1

      - name: Fetch libsodium (MinGW)
        run: |
          echo "OKAY_SODIUM_MINGW_PREFIX=$(bash scripts/fetch-libsodium-mingw.sh "$PWD")" >> "$GITHUB_ENV"   # pinned SHA-256

      # Restores the ci.yml MinGW cache too (same compiler and flags), so the first run is not fully cold.
      - name: Restore compiler cache and downloads
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            build-wt/_deps/*-src
          key: wintests-${{ github.sha }}
          restore-keys: |
            wintests-
            ccache-mingw-ci-

      # Default-off options (own replacements, C#, Xbox) are left at their defaults. -k 0 keeps going past a test
      # that does not compile for Windows; those are listed in the summary instead of stopping the whole run.
      - name: Configure and build the tests
        run: |
          cmake -S . -B build-wt -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
            -DOKAY_BUILD_TESTS=ON -DOKAY_BUILD_SANDBOX=OFF -DOKAY_BUILD_LAUNCHER=OFF \
            -DOKAY_BUILD_PLAYER=OFF -DOKAY_BUILD_EDITOR=OFF -DOKAY_BUILD_PLATFORM_SELFTEST=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_FIND_ROOT_PATH="/usr/x86_64-w64-mingw32" \
            -DOKAY_SODIUM_PREFIX="$OKAY_SODIUM_MINGW_PREFIX"
          set +e
          cmake --build build-wt -j "$(nproc)" -- -k 0 2>&1 | tee build.log
          set -e
          grep '^FAILED: ' build.log | sed 's/^FAILED: //' > build-failures.txt || true
          echo "targets that did not compile: $(wc -l < build-failures.txt)"

      - name: Export the test list and collect the executables
        run: |
          ctest --test-dir build-wt --show-only=json-v1 > tests.json
          mkdir -p wt/bin
          (cd build-wt && find . -path ./_deps -prune -o \( -name '*.exe' -o -name '*.dll' \) -print0 | tar --null -T - -cf - | tar -xf - -C ../wt/bin)
          find "$OKAY_SODIUM_MINGW_PREFIX" -name '*.dll' -exec cp {} wt/bin/ \; || true
          for f in /usr/lib/gcc/x86_64-w64-mingw32/*-win32/{libstdc++-6,libgcc_s_seh-1}.dll; do [ -f "$f" ] && cp "$f" wt/bin/; done
          cp tests.json build-failures.txt wt/
          echo "$PWD/build-wt" > wt/build-root.txt
          echo "bundle before strip: $(du -sh wt | cut -f1)"
          # Every test statically links the whole engine, and each .exe carried its own symbol table (names only: the
          # tests never read them, and Windows does not need them to run). Stripping only our own copies, never the
          # build tree, makes the bundle (about 3 GB unstripped, an upload that ran past the time limit) smaller. All
          # executables stay in the bundle: some tests start a helper .exe by its build-tree path.
          find wt/bin -name '*.exe' -print0 | xargs -0 -r -P "$(nproc)" -n 16 x86_64-w64-mingw32-strip --strip-all \
            || echo "some executables could not be stripped; they are uploaded as built"
          echo "bundle after strip: $(du -sh wt | cut -f1)"

      - name: Upload Windows tests
        uses: actions/upload-artifact@v6
        with:
          name: windows-tests-bin
          path: wt/
          retention-days: 3

      - name: Save compiler cache and downloads
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .ccache
            build-wt/_deps/*-src
          key: wintests-${{ github.sha }}

  test:
    name: Run tests on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # The runner's git turns LF into CRLF on checkout; the tests compare files byte for byte with what the code
      # writes (docs/engine_api.md, scenes, fixtures), so check out exactly the bytes the Linux build saw.
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download Windows tests
        uses: actions/download-artifact@v6
        with:
          name: windows-tests-bin
          path: wt

      - name: Run the tests
        shell: pwsh
        run: |
          $root = (Get-Content wt/build-root.txt).Trim()
          python scripts/run_windows_tests.py --tests wt/tests.json --build-root $root --bin "$PWD/wt/bin" `
            --source "$PWD" --build-failures wt/build-failures.txt --timeout 300 -j $env:NUMBER_OF_PROCESSORS `
            --log Testing/Temporary/LastTest.log --summary $env:GITHUB_STEP_SUMMARY --strict
          exit $LASTEXITCODE

      # The own Win32 platform backend (okay::platform "own": window, events, WGL context, WASAPI, clipboard) on a real
      # Windows desktop, the first run of it outside Wine. --ci: what the runner has no hardware for (an OpenGL driver
      # newer than Windows' built-in 1.1, a sound device) is NOT TESTED with the reason; a window, the event pump,
      # the clipboard or the timers not working is a FAIL and turns this job red. Runs even when unit tests failed.
      - name: Own Win32 platform backend self-test
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path wt/bin -Recurse -Filter okay-platform-selftest.exe | Select-Object -First 1
          if (-not $exe) { Write-Output "okay-platform-selftest.exe is not in the bundle (did it compile? see build-failures.txt)"; exit 1 }
          $env:PATH = "$PWD\wt\bin;$env:PATH"   # libsodium and the MinGW runtime DLLs sit there
          & $exe.FullName --ci 2>&1 | Tee-Object -FilePath platform-selftest.txt
          $rc = $LASTEXITCODE
          "## Own Win32 platform backend self-test (exit $rc)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content platform-selftest.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $rc

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-tests-log
          path: |
            Testing/Temporary/LastTest.log
            wt/build-failures.txt
            platform-selftest.txt
          retention-days: 14
