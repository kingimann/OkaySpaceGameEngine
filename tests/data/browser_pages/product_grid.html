<!DOCTYPE html>
<html><head><title>Shop - Lamps</title>
<style>
body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #fafafa; color: #222; }
.bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e5e5e5; }
.bar .logo { font-weight: bold; font-size: 20px; letter-spacing: -0.5px; }
.bar input { width: 220px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 16px; }
h1 { font-size: 22px; margin: 16px 20px 4px; }
.count { margin: 0 20px; color: #777; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 16px 20px; }
.card { background: #fff; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
.card .img { aspect-ratio: 4 / 3; background: radial-gradient(circle at 50% 40%, #ffe9a8, #c9a227); }
.card .img.b { background: radial-gradient(circle at 50% 40%, #d6ecff, #3d6fa8); }
.card .img.c { background: radial-gradient(circle at 50% 40%, #ffd6d6, #a83d3d); }
.card .body { padding: 8px 10px; }
.card h3 { font-size: 14px; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price { font-weight: bold; color: #b12704; }
.old { color: #999; text-decoration: line-through; font-size: 12px; margin-left: 4px; }
.badge { position: absolute; background: #b12704; color: #fff; font-size: 11px; padding: 2px 6px; }
.card { position: relative; }
button { background: #ffd814; border: 1px solid #fcd200; border-radius: 12px; padding: 4px 10px; font-size: 12px; margin-top: 6px; }
</style></head>
<body>
<div class="bar"><span class="logo">brightshop</span><input type="text" placeholder="Search lamps"></div>
<h1>Desk lamps</h1>
<p class="count">6 results</p>
<div class="grid">
<div class="card"><span class="badge">-20%</span><div class="img"></div><div class="body"><h3>Brass desk lamp with a very long product name</h3><span class="price">$48.00</span><span class="old">$60.00</span><br><button>Add to cart</button></div></div>
<div class="card"><div class="img b"></div><div class="body"><h3>Blue arm lamp</h3><span class="price">$35.00</span><br><button>Add to cart</button></div></div>
<div class="card"><div class="img c"></div><div class="body"><h3>Red mushroom lamp</h3><span class="price">$22.50</span><br><button>Add to cart</button></div></div>
<div class="card"><div class="img"></div><div class="body"><h3>Gold clip lamp</h3><span class="price">$19.99</span><br><button>Add to cart</button></div></div>
<div class="card"><div class="img b"></div><div class="body"><h3>Studio lamp</h3><span class="price">$74.00</span><br><button>Add to cart</button></div></div>
<div class="card"><div class="img c"></div><div class="body"><h3>Night light</h3><span class="price">$9.00</span><br><button>Add to cart</button></div></div>
</div>
</body></html>
