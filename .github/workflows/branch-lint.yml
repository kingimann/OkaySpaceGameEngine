# Branch lint: cheap checks on every push to claude/** and claude2/** (not the full CI; about 1 to 5 minutes).
# Plain rules: docs/collaboration.md. Scripts: scripts/branch_lint.py, bug_patterns.py, collision_check.py.
#   fatal:      forbidden thread includes in Windows code (rule 21a), secrets, a push into the other lane's open claim
#   warnings:   no docs changed, feature map not regenerated, MinGW syntax check, bug-class patterns
# Each warning shows as an annotation on the commit and in the job summary; nothing is commented on any issue or PR.
name: Branch lint
on:
  push:
    branches: ['claude/**', 'claude2/**']
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: branch-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Make sure origin/main is there
        run: git fetch --quiet origin main:refs/remotes/origin/main || true

      - name: "Windows build rule 21a: no thread or mutex use in Windows code (fatal)"
        run: python3 scripts/branch_lint.py includes --base origin/main --head HEAD

      - name: "Secrets (fatal)"
        if: always()
        run: python3 scripts/branch_lint.py secrets --base origin/main --head HEAD

      - name: "No built programs or big binary files in git (fatal)"
        if: always()
        run: python3 scripts/branch_lint.py binaries --base origin/main --head HEAD

      - name: "Claims: do not push into another lane's open claim (fatal)"
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 scripts/collision_check.py --branch "${GITHUB_REF_NAME}" > collision.md || rc=$?
          cat collision.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: "Try-it entries are valid (fatal)"
        if: always()
        run: python3 scripts/gen_try_it.py --check-entries

      - name: "Do not commit the generated docs/try_it.md (warning)"
        if: always()
        run: |
          if [ -n "$(git diff --name-only origin/main...HEAD -- docs/try_it.md)" ]; then
            echo "::warning title=docs/try_it.md::docs/try_it.md is generated. Add or edit a file in docs/try_it/ instead (see docs/try_it/README.md); the coordinator regenerates the page. Committing it makes PRs conflict."
          fi

      - name: "Docs changed with the code (warning)"
        if: always()
        run: python3 scripts/branch_lint.py docs --base origin/main --head HEAD

      - name: "Feature map regenerated (warning)"
        if: always()
        run: |
          if ! python3 scripts/gen_feature_map.py --check; then
            echo "::warning title=Feature map::docs/FEATURE_MAP.md is out of date. Run: python3 scripts/gen_feature_map.py (rule 5). If main changed the map after you branched, merge main first."
          fi

      - name: "UI catalogue regenerated (warning)"
        if: always()
        run: |
          if ! python3 scripts/gen_ui_catalogue.py --check; then
            echo "::warning title=UI catalogue::docs/ui_catalogue.md is out of date. Run: python3 scripts/gen_ui_catalogue.py"
          fi

      - name: "Bug-class patterns (warning)"
        if: always()
        run: python3 scripts/bug_patterns.py --base origin/main --head HEAD --github | tee bug_patterns.txt

      - name: "Are engine files changed? (decides whether to install MinGW)"
        if: always()
        id: eng
        run: |
          n=$(git diff --name-only origin/main...HEAD -- 'engine/**.hpp' 'engine/**.h' 'engine/**.cpp' | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Install the MinGW compiler (same way as release.yml, only when engine files changed)
        if: always() && steps.eng.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          bash scripts/ci-apt-mirror.sh || true
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT install -y --no-install-recommends g++-mingw-w64-x86-64 mingw-w64-x86-64-dev

      - name: "MinGW -fsyntax-only on changed engine files (warning)"
        if: always() && steps.eng.outputs.count != '0'
        continue-on-error: true
        run: python3 scripts/branch_lint.py mingw --base origin/main --head HEAD
